<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HAYVAR · administración</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">

<!-- La página de adentro. Junta en un solo lugar lo que hasta ahora estaba
     desparramado en cinco direcciones de JSON crudo: el estado del
     servidor, cuánto tarda cada cosa, qué hay guardado en la base, cuánto
     lleva bajado cada torneo y si las fuentes contestan.

     No es parte del sitio: no se enlaza desde ningún lado, pide la misma
     llave que el resto de las puertas de servicio y le dice a los
     buscadores que no la indexen.

     La idea es que se pueda mirar de un vistazo y que las cosas que
     necesitan atención salten solas, sin tener que leer números. Por eso
     cada tarjeta se pinta según cómo está: verde bien, amarillo mirar,
     rojo actuar. -->
<style>
:root{
  --nav:#141b34; --nav2:#1c2547; --bg:#eceef2; --card:#fff; --line:#e2e5ec;
  --txt:#1a1f2e; --txt2:#6b7285; --txt3:#9aa1b3;
  --ok:#12b76a; --mirar:#f0b429; --mal:#e5484d; --acc:#2f6fed;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);
  font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
header{background:var(--nav);color:#fff;padding:14px 20px;display:flex;
  align-items:center;gap:14px;flex-wrap:wrap}
header b{font-size:17px;letter-spacing:-.3px}
header .et{font-size:10px;background:rgba(255,255,255,.16);padding:3px 8px;
  border-radius:99px;text-transform:uppercase;letter-spacing:.8px}
header .der{margin-left:auto;display:flex;gap:8px;align-items:center;
  font-size:12px;color:rgba(255,255,255,.7)}
header button{background:rgba(255,255,255,.14);color:#fff;border:0;
  border-radius:7px;padding:7px 13px;font:inherit;font-size:12.5px;
  cursor:pointer}
header button:hover{background:rgba(255,255,255,.26)}
main{padding:18px;max-width:1180px;margin:0 auto}
.grilla{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:14px;margin-bottom:18px}
.caja{background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:14px 16px;position:relative;overflow:hidden}
.caja::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;
  background:var(--línea,transparent)}
.caja.ok::before{background:var(--ok)}
.caja.mirar::before{background:var(--mirar)}
.caja.mal::before{background:var(--mal)}
.rot{font-size:10.5px;text-transform:uppercase;letter-spacing:.7px;
  color:var(--txt2);margin-bottom:6px}
.dato{font-size:25px;font-weight:800;line-height:1.1;
  font-variant-numeric:tabular-nums}
.pie{font-size:12px;color:var(--txt2);margin-top:5px}
.aviso{font-size:12.5px;margin-top:8px;padding:8px 10px;border-radius:8px;
  background:rgba(240,180,41,.14);color:#7a5a00}
.caja.mal .aviso{background:rgba(229,72,77,.12);color:#a1272b}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.8px;
  color:var(--txt2);margin:22px 0 10px;font-weight:700}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;
  overflow:hidden}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:10.5px;text-transform:uppercase;
  letter-spacing:.6px;color:var(--txt2);padding:9px 14px;
  border-bottom:1px solid var(--line);font-weight:600}
td{padding:8px 14px;border-bottom:1px solid var(--line);
  font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
td.n{text-align:right}
td.ruta{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
/* El recorrido de una visita, debajo de su fila */
tr.recorrido td{padding-top:0;padding-bottom:9px;border-bottom:1px solid var(--line)}
tr.recorrido+tr td{border-top:0}
.paso{display:inline-block;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size:11px;color:var(--txt2);background:var(--bg);border-radius:5px;
  padding:2px 7px;margin:2px 4px 0 0}
.paso+.paso::before{content:"›";margin-right:6px;margin-left:-3px;color:var(--txt3)}
.barra{height:5px;border-radius:3px;background:var(--line);overflow:hidden;
  margin-top:6px}
.barra i{display:block;height:100%;background:var(--acc)}
.lento{color:var(--mal);font-weight:700}
.medio{color:var(--mirar);font-weight:600}
.pill{display:inline-block;font-size:10.5px;padding:2px 8px;border-radius:99px;
  background:var(--bg);color:var(--txt2)}
.pill.ok{background:rgba(18,183,106,.14);color:#067647}
.pill.mal{background:rgba(229,72,77,.12);color:#a1272b}
.vacio{padding:26px;text-align:center;color:var(--txt2);font-size:13px}
.puerta{max-width:420px;margin:14vh auto;background:var(--card);
  border:1px solid var(--line);border-radius:12px;padding:22px}
.puerta input{width:100%;padding:11px 12px;font:inherit;border-radius:8px;
  border:1px solid var(--line);margin-top:10px}
.puerta button{width:100%;margin-top:10px;padding:11px;font:inherit;
  font-weight:600;background:var(--nav);color:#fff;border:0;border-radius:8px;
  cursor:pointer}
.err{color:var(--mal);font-size:12.5px;margin-top:10px}
/* Bajar la copia tiene que ser un enlace de verdad —son 200 MB y los
   escribe el navegador, no nosotros— pero al lado de dos botones queda
   raro si no se parece a un botón. */
a.bt{display:inline-block;font:inherit;font-size:12px;padding:3px 9px;
  border:1px solid var(--line);border-radius:6px;background:var(--card);
  color:var(--txt);text-decoration:none;cursor:pointer}
a.bt:hover{background:var(--bg)}
footer{max-width:1180px;margin:0 auto;padding:6px 18px 30px;
  font-size:11.5px;color:var(--txt3)}
</style>
</head>
<body>

<div id="app"><div class="vacio" style="padding:60px">Cargando…</div></div>

<script>
/*! HAYVAR — página de administración. © 2026 Mateo Schreiner. */

/* La llave sale de la dirección con la que entraste. No se guarda en el
   navegador a propósito: si alguien se sienta en tu compu después, no la
   encuentra. Si entrás sin llave, la página la pide y la usa sólo en
   memoria, mientras la pestaña esté abierta. */
let LLAVE = new URLSearchParams(location.search).get('llave') || '';

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const megas = b => b == null ? '—' : (b / 1048576).toFixed(1) + ' MB';
const miles = n => (n ?? 0).toLocaleString('es-AR');

function rato(s){
  if(s == null) return '—';
  if(s < 60) return Math.round(s) + ' s';
  if(s < 3600) return Math.round(s / 60) + ' min';
  if(s < 86400) return (s / 3600).toFixed(1) + ' h';
  return (s / 86400).toFixed(1) + ' días';
}

async function pedir(ruta){
  const u = ruta + (ruta.includes('?') ? '&' : '?') + 'llave=' +
            encodeURIComponent(LLAVE);
  const r = await fetch(u, {cache: 'no-store'});
  if(r.status === 403) throw new Error('403');
  if(!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}

function pedirLlave(motivo){
  $('#app').innerHTML = `<div class="puerta">
    <b style="font-size:16px">Administración de HAYVAR</b>
    <div style="color:var(--txt2);font-size:13px;margin-top:6px">
      Esta página no es pública. Pegá la llave para entrar.</div>
    <input id="k" type="password" placeholder="la llave" autocomplete="off">
    <button onclick="entrar()">Entrar</button>
    ${motivo ? `<div class="err">${esc(motivo)}</div>` : ''}
  </div>`;
  $('#k').focus();
  $('#k').onkeydown = e => { if(e.key === 'Enter') entrar(); };
}
function entrar(){ LLAVE = $('#k').value.trim(); if(LLAVE) cargar(); }

/* ── las tarjetas de arriba ──────────────────────────────────────────── */
function caja(estado, rotulo, dato, pie, aviso){
  return `<div class="caja ${estado}">
    <div class="rot">${esc(rotulo)}</div>
    <div class="dato">${dato}</div>
    ${pie ? `<div class="pie">${pie}</div>` : ''}
    ${aviso ? `<div class="aviso">${aviso}</div>` : ''}
  </div>`;
}

function salud(t, base, diag){
  let c = '';

  // ── el servidor ──
  c += caja('ok', 'Arriba hace', rato(t.arriba_hace_s),
            'Se reinicia en cada publicación');

  // ── el disco: lo que más callado se llena ──
  const usado = base.bytes || 0;
  // el disco de Render es de 1 GB; si algún día cambia, cambiar acá
  const TOPE = 1024 * 1024 * 1024;
  const pc = Math.min(100, 100 * usado / TOPE);
  let e = pc > 85 ? 'mal' : pc > 60 ? 'mirar' : 'ok';
  c += caja(e, 'Base de datos', megas(usado),
    `${miles(base.entradas)} entradas · ${pc.toFixed(0)}% del disco
     <div class="barra"><i style="width:${pc}%;
       background:${e === 'mal' ? 'var(--mal)' : e === 'mirar' ? 'var(--mirar)' : 'var(--acc)'}"></i></div>`,
    base.sobrevive_al_deploy === false
      ? 'La base vive en la carpeta del código: se borra en cada publicación.'
      : pc > 60 ? `Agrandar el disco sale 25 centavos de dólar por giga por mes.`
                : '');

  /* Qué está ocupando el disco. Sin este desglose, "202 MB" no dice qué
     hacer: hay que saber si es caché repetida —que se tira sola— o
     información de partidos, que se queda y entonces lo que hay que hacer
     es agrandar el disco. */
  // ── la última limpieza ──
  const li = base.limpieza;
  if(li){
    c += caja('ok', 'Última limpieza', megas(li.bytes || 0),
      `${miles(li.filas)} entradas de caché · ${li.visitas || 0} días de
       visitas<br>${esc((li.cuando || '').replace('T', ' '))}`);
  }

  // ── la memoria, que es lo que hizo reiniciar el servicio una vez ──
  const m = t.memoria || {};
  const mp = 100 * (m.megas || 0) / 8;
  c += caja(mp > 90 ? 'mirar' : 'ok', 'Memoria de respuestas',
    (m.megas ?? 0) + ' MB',
    `${miles(m.respuestas)} guardadas · tope 8 MB
     <div class="barra"><i style="width:${Math.min(100, mp)}%"></i></div>`);

  // ── el recolector de fondo ──
  const f = t.fondo || {};
  c += caja(f.historia_al_dia ? 'ok' : 'mirar', 'Recolector',
    esc(f.haciendo || '—'),
    `vuelta ${miles(f.vuelta)} · ${f.historia_al_dia
       ? 'historia completa' : 'todavía bajando historia'}`);

  // ── las fuentes ──
  if(diag && !diag.error){
    const af = diag.apifootball || {};
    const anda = af.clave_configurada !== false && !af.error;
    c += caja(anda ? 'ok' : 'mirar', 'API-Football',
      anda ? 'responde' : 'sin clave',
      anda ? '' : 'El sitio anda igual: sólo se pierden sus datos.');
  }
  return `<div class="grilla">${c}</div>`;
}

/* ── cuánto tarda cada cosa ──────────────────────────────────────────── */
function tiempos(t){
  const r = (t.rutas || []).filter(x => x.veces > 0);
  if(!r.length) return '<div class="panel"><div class="vacio">Todavía no pasó nadie.</div></div>';
  const clase = ms => ms > 1500 ? 'lento' : ms > 400 ? 'medio' : '';
  return `<div class="panel"><table>
    <tr><th>Dirección</th><th class="n">Veces</th><th class="n">Promedio</th>
        <th class="n">La peor</th><th class="n">La última</th>
        <th class="n">Total</th></tr>
    ${r.map(x => `<tr>
      <td class="ruta">${esc(x.ruta)}</td>
      <td class="n">${miles(x.veces)}</td>
      <td class="n ${clase(x.promedio_ms)}">${miles(x.promedio_ms)} ms</td>
      <td class="n ${clase(x.peor_ms)}">${miles(x.peor_ms)} ms</td>
      <td class="n">${miles(x.ultima_ms)} ms</td>
      <td class="n">${x.total_s} s</td></tr>`).join('')}
  </table></div>
  <footer>En rojo lo que pasa de 1,5 segundos; en amarillo lo que pasa de
  medio segundo. "Total" es el tiempo que esa dirección consumió en toda la
  vida del servidor: una rápida que se pide mil veces pesa más que una lenta
  que se pide una.</footer>`;
}

/* ── qué hay guardado ────────────────────────────────────────────────── */
function contenido(c){
  const g = (c.grupos || []).slice(0, 14);
  const total = (c.grupos || []).reduce((a, x) => a + x.cantidad, 0) || 1;
  return `<div class="panel"><table>
    <tr><th>Tipo</th><th>Qué es</th><th class="n">Cuántos</th><th style="width:120px"></th></tr>
    ${g.map(x => `<tr>
      <td class="ruta">${esc(x.tipo)}</td>
      <td style="color:var(--txt2)">${esc(x.que_es || '')}</td>
      <td class="n">${miles(x.cantidad)}</td>
      <td><div class="barra" style="margin:0"><i style="width:${100 * x.cantidad / total}%"></i></div></td>
    </tr>`).join('')}
  </table></div>`;
}

/* ── cuánto lleva bajado cada torneo ─────────────────────────────────── */
function recorrido(r){
  const ligas = r.ligas || [];
  if(!ligas.length) return '';
  const filas = [];
  for(const l of ligas){
    for(const c of (l.comps || [])){
      const a = c.atras || {}, d = c.adelante || {};
      const listo = a.listo && d.listo;
      const v = c.loQueSeMuestra || l.loQueSeMuestra || {};
      filas.push(`<tr>
        <td>${esc(l.nombre)}</td>
        <td class="n">${miles(c.guardados)}</td>
        <td class="n">${miles(c.fechasQueTiene ?? '—')}</td>
        <td><span class="pill ${listo ? 'ok' : ''}">${listo ? 'completo' : 'bajando'}</span></td>
        <td style="color:var(--txt2);font-size:12px">${esc(
          (v.sinResultado ? v.sinResultado + ' sin resultado · ' : '') +
          (v.sinLiveId ? v.sinLiveId + ' sin detalle' : '')) || ''}</td>
      </tr>`);
    }
  }
  return `<div class="panel"><table>
    <tr><th>Torneo</th><th class="n">Partidos</th><th class="n">Fechas</th>
        <th>Recorrido</th><th>Faltantes</th></tr>
    ${filas.join('')}</table></div>`;
}

/* ── quién entra ─────────────────────────────────────────────────────── */
function visitasHoy(v){
  const h = v.hoy || {};
  const min = s => s >= 60 ? (s / 60).toFixed(1) + ' min' : Math.round(s) + ' s';
  return `<div class="grilla">
    ${caja('ok', 'Personas hoy', miles(h.gente),
           'distintas, contadas sin guardar quién son')}
    ${/* Visitas y páginas no son lo mismo: el que entra por un partido y
          después recorre cuatro torneos es una visita y cinco páginas.
          Hasta que la página no avisó cada pantalla, acá había un solo
          número y decía las dos cosas mal. */''}
    ${caja('ok', 'Visitas', miles(h.vistas),
           `${h.vistasPorPersona} por persona`)}
    ${caja('ok', 'Páginas vistas', miles(h.paginas ?? h.vistas),
           `${h.paginasPorVisita ?? 1} por visita`,
           (h.paginasPorVisita ?? 1) < 1.3 && h.vistas > 20
             ? 'Casi nadie pasa de la pantalla por la que entró. Vale mirar a qué páginas están llegando.'
             : '')}
    ${caja(h.porPersona < 20 ? 'mirar' : 'ok', 'Se quedan', min(h.porPersona),
           'promedio por persona',
           h.porPersona < 20 && h.gente > 5
             ? 'Menos de veinte segundos: o no encuentran lo que buscaban, o entran, miran un resultado y se van. Las dos cosas son información.'
             : '')}
  </div>`;
}

function listado(titulo, items, vacio){
  if(!items || !items.length)
    return `<div class="panel"><div class="vacio">${esc(vacio || 'Todavía nada.')}</div></div>`;
  const total = items.reduce((a, x) => a + x.cuantas, 0) || 1;
  return `<div class="panel"><table>
    ${items.map(x => `<tr>
      <td>${esc(x.que || '—')}</td>
      <td class="n" style="width:60px">${miles(x.cuantas)}</td>
      <td style="width:110px"><div class="barra" style="margin:0">
        <i style="width:${100 * x.cuantas / total}%"></i></div></td>
    </tr>`).join('')}
  </table></div>`;
}

function dias(v){
  const d = v.porDia || [];
  const tope = Math.max(1, ...d.map(x => x.vistas));
  return `<div class="panel" style="padding:14px 16px">
    <div style="display:flex;align-items:flex-end;gap:4px;height:90px">
      ${d.map(x => `<div style="flex:1;text-align:center" title="${esc(x.dia)}: ${x.vistas} vistas, ${x.gente} personas">
        <div style="height:${Math.max(2, 74 * x.vistas / tope)}px;
          background:var(--acc);border-radius:3px 3px 0 0;opacity:${x.vistas ? 1 : .25}"></div>
        <div style="font-size:9px;color:var(--txt3);margin-top:4px">${x.dia.slice(8)}</div>
      </div>`).join('')}
    </div></div>`;
}

function ultimas(v){
  const u = v.ultimas || [];
  if(!u.length) return '<div class="panel"><div class="vacio">Todavía no entró nadie.</div></div>';
  const hora = t => new Date(t * 1000).toLocaleTimeString('es-AR',
    {hour: '2-digit', minute: '2-digit'});
  /* Por dónde siguió después de entrar. Es la mitad que faltaba: "entró
     por Boca–River" no dice nada solo; "entró por Boca–River y después se
     fue a la tabla de la Liga Profesional" sí. */
  const camino = x => {
    const v = x.vio || [];
    if(!v.length) return '<span style="color:var(--txt3)">se fue de ahí</span>';
    const mas = (x.vistas || 1) - 1 - v.length;
    return v.map(r => `<span class="paso">${esc(r)}</span>`).join('')
      + (mas > 0 ? `<span style="color:var(--txt3)"> +${mas}</span>` : '');
  };
  return `<div class="panel"><table>
    <tr><th>Hora</th><th>Entró por</th><th>Vino de</th><th>Buscó</th>
        <th>Dispositivo</th><th class="n">Págs.</th>
        <th class="n">Se quedó</th></tr>
    ${u.slice(0, 40).map(x => `<tr>
      <td style="color:var(--txt2)">${hora(x.t)}</td>
      <td class="ruta">${esc(x.ruta)}</td>
      <td>${esc(x.fuente)}${x.region ? ` <span class="pill">${esc(x.region)}</span>` : ''}</td>
      <td style="color:var(--txt2)">${esc(x.busco || '—')}</td>
      <td style="color:var(--txt2)">${esc(x.disp)} · ${esc(x.so)}</td>
      <td class="n">${x.vistas || 1}</td>
      <td class="n">${x.seg ? x.seg + ' s' : '—'}</td>
    </tr>
    <tr class="recorrido"><td></td><td colspan="6">${camino(x)}</td></tr>`).join('')}
  </table></div>
  <footer>Debajo de cada visita, por dónde siguió. La pantalla por la que
  entró no se repite ahí.</footer>`;
}

/* La tabla de partidos: uno por fila.

   Todavía no la usa ninguna pantalla. Está acá para poder mirarla: si los
   números de acá no cuadran con los torneos, la tabla está mal armada y
   hay que verlo antes de empezar a leer de ella. */
function tablaDePartidos(base){
  const t = base.tablas, c = base.tablasCuando;
  if(!t || !t.porLiga || !t.porLiga.length)
    return `<div class="panel"><div class="vacio">Todavía no se armó.
      Se arma sola cuando el recolector termina de recorrer los
      calendarios.</div></div>`;
  return `<div class="grilla" style="margin-bottom:14px">
    ${caja('ok', 'Partidos en fila', miles(t.partidos),
           `${miles(t.equipos)} equipos distintos`)}
    ${caja('ok', 'Quién jugó qué', miles(t.participaciones || 0),
           `${miles(t.jugadores || 0)} jugadores · ${miles(t.goles || 0)} goles
            con autor y minuto`)}
    ${caja('ok', 'Formaciones', miles(t.conFormacion || 0),
           `partidos con el once y el dibujo · ${miles(t.formaciones || 0)}
            jugadores · ${miles(t.estadisticas || 0)} estadísticas`)}
    ${/* Los partidos viejos se completan de a poco en los ratos libres del
          recolector: mil ochocientos pedidos de golpe contra una API
          privada es la forma más corta de que te corten el acceso. */''}
    ${t.faltanFormaciones ? caja('mirar', 'Historia por completar',
        miles(t.faltanFormaciones),
        `partidos viejos sin formación · ${t.porVuelta} por vuelta en los
         ratos libres · unos ${Math.ceil(t.faltanFormaciones /
           (t.porVuelta || 5) / 96)} días`) : ''}
    ${caja('ok', 'Leídos de los bloques', miles((c || {}).leidos || 0),
      (c || {}).leidos && (c || {}).leidos !== t.filas
        ? `${miles(((c || {}).leidos || 0) - t.partidos)} repetidos, unificados`
        : 'sin repetidos')}
    ${caja('ok', 'Última vez', esc(((c || {}).cuando || '—').replace('T', ' ')),
           'se rehace al recorrer los calendarios')}
  </div>
  <div class="panel"><table>
    <tr><th>Torneo</th><th class="n">Partidos</th><th class="n">Temporadas</th>
        <th class="n">Con resultado</th><th>Período</th></tr>
    ${t.porLiga.map(l => `<tr>
      <td class="ruta">${esc(l.liga)}</td>
      <td class="n">${miles(l.partidos)}</td>
      <td class="n">${l.temporadas}</td>
      <td class="n">${miles(l.jugados)}</td>
      <td style="color:var(--txt2)">${esc(l.desde)} → ${esc(l.hasta)}</td>
    </tr>`).join('')}
  </table></div>
  <footer>Los mismos datos que ya estaban en los calendarios, pero uno por
  fila: así se les puede preguntar algo. Los bloques siguen siendo la
  verdad y las pantallas se siguen sirviendo de ahí; esto se arma leyendo
  de ellos, sin pedirle nada a la fuente. Si sale mal, se borra y se
  rearma.</footer>`;
}

/* Qué está ocupando el disco, familia por familia.

   Sin esto, "202 MB" no dice qué hacer. Con esto sí: si lo que pesa es
   caché de pedidos, se tira sola y no hay nada que decidir; si lo que pesa
   es información de partidos, el disco hay que agrandarlo, y eso son 25
   centavos de dólar por giga por mes. */
function queOcupa(base){
  const pesos = base.pesos;
  if(!pesos || pesos.error || !pesos.length)
    return '<div class="panel"><div class="vacio">Todavía no se pudo medir.</div></div>';
  const sobra = new Set(base.cacheQueSobra || []);
  const total = pesos.reduce((s, p) => s + (p.bytes || 0), 0) || 1;
  return `<div class="panel"><table>
    <tr><th>Qué es</th><th class="n">Entradas</th><th class="n">Peso</th>
        <th class="n">Parte</th><th class="n">La más vieja</th>
        <th>Qué se hace</th></tr>
    ${pesos.slice(0, 16).map(p => `<tr>
      <td class="ruta">${esc(p.familia)}</td>
      <td class="n">${miles(p.filas)}</td>
      <td class="n">${megas(p.bytes)}</td>
      <td class="n">${(100 * p.bytes / total).toFixed(0)}%</td>
      <td class="n">${p.dias} d</td>
      <td>${sobra.has(p.familia)
        ? `<span class="pill">se tira a los ${base.diasDeCache} días</span>`
        : '<span class="pill ok">se queda</span>'}</td></tr>`).join('')}
  </table></div>
  <footer>Se tira sólo la caché de pedidos que ya nadie hace: lo que sirve
  de adentro ya está leído y guardado aparte, y si hiciera falta otra vez se
  vuelve a pedir sola. Los partidos y los jugadores no caducan y no se
  tocan — alguien puede querer ver un partido viejo, y las comparaciones
  entre temporadas se hacen con eso. Si el disco se llena, agrandarlo sale
  25 centavos de dólar por giga por mes.</footer>`;
}

/* ── armar todo ──────────────────────────────────────────────────────── */
/* Los colores que salen del escudo contra los cargados a mano.

   Va con las muestras al lado y no con los códigos: nadie puede decidir si
   un color está bien leyendo "#0a2472". La pregunta que esta tabla
   contesta es una sola —¿conviene sacarlos automáticamente en las otras
   trece competencias?— y para eso hay que verlos. */
function colores(c){
  if(!c || !c.filas) return '<div class="vacio">No se pudo leer.</div>';
  const muestra = (a, b) => `<span style="display:inline-flex;vertical-align:middle;
    border-radius:4px;overflow:hidden;border:1px solid rgba(0,0,0,.25)">
    <i style="display:block;width:22px;height:16px;background:${esc(a)}"></i>
    <i style="display:block;width:22px;height:16px;background:${esc(b)}"></i></span>`;
  const filas = c.filas.map(f => `<tr>
    <td>${esc(f.club)}</td>
    <td>${muestra(f.aMano[0], f.aMano[1])}</td>
    <td>${f.delEscudo ? muestra(f.delEscudo[0], f.delEscudo[1])
        : '<span class="vacio">no se pudo leer</span>'}</td>
    <td style="text-align:right">${f.delEscudo
        ? Math.round(f.parte[0]*100) + '% / ' + Math.round(f.parte[1]*100) + '%' : '—'}</td>
    <td style="text-align:right">${f.distancia != null ? f.distancia : '—'}</td>
    <td>${f.delEscudo ? (f.pega ? '✓ pega' : '✗ no pega')
        + (f.dado_vuelta ? ' (al revés)' : '') : ''}</td></tr>`).join('');
  const pc = c.leidos ? Math.round(c.pegan / c.leidos * 100) : 0;
  return `<div class="tarj" style="margin-bottom:10px">
      <b style="font-size:22px">${c.pegan} de ${c.leidos}</b>
      <span>escudos que dan el color del club (${pc}%).
      ${c.total - c.leidos} no se pudieron leer.</span></div>
    <table><thead><tr><th>Club</th><th>A mano</th><th>Del escudo</th>
      <th style="text-align:right">Cuánto ocupa</th>
      <th style="text-align:right">Distancia</th><th></th></tr></thead>
      <tbody>${filas}</tbody></table>
    <footer>${esc(c.nota || '')} Acá no se cambia nada: los clubes de
      Primera siguen usando los colores cargados a mano.</footer>`;
}

/* Qué clubes se estaban confundiendo con otro por el parecido de nombres.

   El índice tiene sólo los treinta de Primera, y fuera de la Liga
   Profesional juegan clubes de todas las divisiones: "Gimnasia de Jujuy"
   terminaba pegado a Gimnasia LP. Como ese nombre es el que se guarda en
   la tabla de partidos, esos partidos quedaron en el historial del otro
   club. Esta tabla no corrige: cuenta, para poder decidir con el número
   a la vista. */
function nombres(n){
  if(!n || !n.competencias) return '<div class="vacio">No se pudo leer.</div>';
  if(!n.competencias.length)
    return '<div class="tarj"><b style="font-size:22px">Ninguno</b>'
      + '<span>Ningún club se está confundiendo con otro.</span></div>';
  return `<div class="tarj" style="margin-bottom:10px">
      <b style="font-size:22px">${n.clubes} clubes</b>
      <span>se estaban tomando por otro, en ${n.partidos} partidos
      guardados.</span></div>
    ${n.competencias.map(c => `<h3 style="margin:14px 0 4px;font-size:13px">
        ${esc(c.nombre)} <span class="vacio">· ${c.partidos} partidos</span></h3>
      <table><thead><tr><th>Club</th><th>Lo tomaba por</th>
        <th style="text-align:right">Partidos</th></tr></thead><tbody>
      ${c.clubes.map(x => `<tr><td>${esc(x.club)}</td>
        <td>${esc(x.loTomabaPor)}</td>
        <td style="text-align:right">${x.partidos}</td></tr>`).join('')}
      </tbody></table>`).join('')}
    <footer>${esc(n.nota || '')}</footer>`;
}

/* Corregir los partidos que quedaron guardados con el club equivocado.

   En dos pasos a propósito: primero se ve qué cambiaría y recién después
   se aplica, con una confirmación en el medio. Reescribe filas ya
   guardadas —no borra nada— y antes saca una copia de la base. */
async function corregir(){
  const caja = $('#corregir');
  caja.innerHTML = '<div class="vacio">Mirando…</div>';
  let r;
  try{ r = await pedir('/api/corregir'); }
  catch(e){ caja.innerHTML = '<div class="vacio">No se pudo: '
    + esc(e.message) + '</div>'; return; }
  if(!r.partidos){
    caja.innerHTML = '<div class="tarj"><b style="font-size:22px">Nada</b>'
      + '<span>No quedó ningún partido con el club equivocado.</span></div>';
    return;
  }
  caja.innerHTML = `<div class="tarj" style="margin-bottom:10px">
      <b style="font-size:22px">${r.partidos} partidos</b>
      <span>cambiarían de club, en ${r.calendarios} calendarios.
      Todavía no se tocó nada.</span></div>
    ${listaDeCopias(r.copias)}
    <table><thead><tr><th>Se le sacan a</th><th>Y pasan a</th>
      <th>Competencia</th>
      <th style="text-align:right">Partidos</th></tr></thead><tbody>
    ${r.cambios.map(c => `<tr><td>${esc(c.leSacamosA)}</td>
      <td>${esc(c.club)}</td>
      <td style="color:var(--txt2)">${esc(c.liga || '')}</td>
      <td style="text-align:right">${c.partidos}</td></tr>`).join('')}
    </tbody></table>
    <div style="padding:12px 14px">
      <button onclick="aplicarCorreccion()">Corregirlos</button>
      <span class="vacio" style="padding:0 0 0 10px">Saca una copia de la
        base antes. No borra nada.</span></div>`;
}

async function aplicarCorreccion(){
  if(!confirm('Reescribe el club de esos partidos en la base.\n'
      + 'Antes saca una copia. ¿Seguimos?')) return;
  const caja = $('#corregir');
  caja.innerHTML = '<div class="vacio">Corrigiendo…</div>';
  let r;
  try{ r = await pedir('/api/corregir?aplicar=si'); }
  catch(e){ caja.innerHTML = '<div class="vacio">No se pudo: '
    + esc(e.message) + '</div>'; return; }
  caja.innerHTML = `<div class="tarj">
      <b style="font-size:22px">${r.partidos} corregidos</b>
      <span>${r.escritos} filas reescritas.${r.copia
        ? ' Copia de la base en ' + esc(r.copia.archivo)
          + ' (' + megas(r.copia.bytes) + ').'
        : ' No se pudo sacar la copia.'}</span></div>
    ${listaDeCopias(r.copias)}`;
}

/* Las copias que hay en el disco. Una copia que no podés ver no sirve de
   mucho: esto es para poder confirmar que está y cuánto pesa.

   Ojo con lo que protege: vive en el MISMO disco que la base. Sirve para
   volver atrás si una corrección sale mal, no para el día que se pierda el
   disco. Para eso habría que bajarla afuera. */
function listaDeCopias(copias){
  if(!copias || !copias.length)
    return `<div style="padding:8px 14px" class="vacio">Todavía no hay
      ninguna copia. <button onclick="soloCopia()">Sacar una ahora</button></div>`;
  /* Cada copia con lo que se le puede hacer.

     El orden de los botones es el orden en que hay que usarlos: revisar,
     bajar, borrar. Borrar va último y pregunta, porque una copia que
     borrás sin haber bajado es una copia que no tenés. */
  // Se guarda para poder redibujar después de revisar o de borrar sin
  // tener que volver a pedir la lista.
  ultimasCopias = copias;
  return `<div style="padding:10px 14px">
    <div class="rot">Copias en el disco</div>
    ${copias.map(c => `<div style="font-size:12.5px;color:var(--txt2);
        display:flex;align-items:center;gap:8px;padding:3px 0;flex-wrap:wrap">
      <span>${esc(c.archivo)} · ${megas(c.bytes)}</span>
      <button onclick="revisarCopia('${esc(c.archivo)}')">Revisar</button>
      <a class="bt" href="${esc(conLlave('/api/copia?bajar='
          + encodeURIComponent(c.archivo)))}">Bajar</a>
      <button onclick="borrarCopia('${esc(c.archivo)}', '${megas(c.bytes)}')"
        >Borrar</button>
    </div>`).join('')}
    <div style="margin-top:8px">
      <button onclick="soloCopia()">Sacar otra</button>
      <button onclick="revisarCopia('')">Revisar la base</button>
      <span class="vacio" style="padding:0 0 0 8px">Están en el mismo disco
        que la base: una copia acá no salva de perder el disco.</span>
    </div></div>`;
}

/* Bajar es un enlace y no un `fetch`: son 200 MB, y así los guarda el
   navegador de a poco en vez de juntarlos en memoria antes de escribir.
   Como es un enlace, la llave tiene que ir en la dirección. */
function conLlave(u){
  return LLAVE ? u + '&llave=' + encodeURIComponent(LLAVE) : u;
}

async function revisarCopia(nombre){
  const caja = $('#copias');
  const antes = caja.innerHTML;
  caja.innerHTML = '<div class="vacio">Revisando… puede tardar un rato.</div>';
  try{
    const r = await pedir('/api/copia?revisar=' + (nombre
      ? encodeURIComponent(nombre) : 'si'));
    const filas = Object.entries(r.filas || {})
      .sort((a, b) => b[1] - a[1])
      .map(([t, n]) => `${esc(t)} ${n === null ? '?' : n.toLocaleString('es-AR')}`)
      .join(' · ');
    caja.innerHTML = `<div class="tarj"><b style="font-size:20px;color:${
      r.sana ? 'var(--ok, #1a8f3c)' : '#c62828'}">${
      r.sana ? 'Sana' : 'Algo anda mal'}</b>
      <span>${esc(r.archivo || '')} · ${megas(r.bytes)}</span></div>
      <div style="padding:10px 14px;font-size:12.5px;color:var(--txt2)">
        <div>${esc((r.integridad || [r.error || 'sin respuesta']).join(' · '))}</div>
        ${r.huerfanas != null ? `<div>${r.huerfanas} filas huérfanas</div>` : ''}
        ${filas ? `<div style="margin-top:6px">${filas}</div>` : ''}
      </div>${listaDeCopias(ultimasCopias)}`;
  }catch(e){ caja.innerHTML = antes; alert('No se pudo: ' + e.message); }
}

async function borrarCopia(nombre, cuanto){
  if(!confirm('Borrar ' + nombre + ' (' + cuanto + ')?\n\n'
      + 'Esto no se puede deshacer. Bajala antes si todavía no lo hiciste.')) return;
  const caja = $('#copias');
  const antes = caja.innerHTML;
  caja.innerHTML = '<div class="vacio">Borrando…</div>';
  try{
    const r = await pedir('/api/copia?borrar=' + encodeURIComponent(nombre));
    if(r.error) throw new Error(r.error);
    const lista = await pedir('/api/copia');
    ultimasCopias = lista.copias || [];
    caja.innerHTML = `<div class="tarj"><b style="font-size:20px">Borrada</b>
      <span>${esc(r.borrado)} · ${megas(r.bytes)} liberados</span></div>
      ${listaDeCopias(ultimasCopias)}`;
  }catch(e){ caja.innerHTML = antes; alert('No se pudo: ' + e.message); }
}

// La última lista que vimos, para poder redibujarla después de revisar o
// borrar sin volver a pedirla.
let ultimasCopias = [];

async function soloCopia(){
  const caja = $('#copias');
  const antes = caja.innerHTML;
  caja.innerHTML = '<div class="vacio">Copiando…</div>';
  try{
    const r = await pedir('/api/corregir?copia=si');
    caja.innerHTML = `<div class="tarj"><b style="font-size:20px">${
      r.copia ? 'Copia hecha' : 'No se pudo'}</b><span>${
      r.copia ? esc(r.copia.archivo) + ' · ' + megas(r.copia.bytes) : ''
      }</span></div>${listaDeCopias(r.copias)}`;
  }catch(e){ caja.innerHTML = antes; alert('No se pudo: ' + e.message); }
}

async function cargar(){
  $('#app').innerHTML = '<div class="vacio" style="padding:60px">Cargando…</div>';
  let t, base, cont, rec, diag, vis, col, nom, cop;
  try{
    // se piden todas juntas: es la misma idea que usamos en la portada
    [t, base, cont, rec, diag, vis, col, nom, cop] = await Promise.all([
      pedir('/api/tiempos'),
      pedir('/api/base'),
      pedir('/api/contenido'),
      pedir('/api/recorrido').catch(() => ({})),
      pedir('/api/diagnostico').catch(() => ({error: 'no contestó'})),
      pedir('/api/visitas').catch(() => ({})),
      // La primera vez baja treinta escudos, así que puede tardar. Si no
      // contesta, el resto del admin se muestra igual.
      pedir('/api/colores').catch(() => null),
      // Recorre el calendario de las trece competencias; si tarda o falla,
      // el resto del admin se muestra igual.
      pedir('/api/nombres').catch(() => null),
      // Las copias que hay en el disco. Es sólo un listdir, no cuesta nada.
      pedir('/api/copia').catch(() => null),
    ]);
  }catch(e){
    return pedirLlave(e.message === '403'
      ? 'Esa llave no es. Fijate en Render, en Environment, la variable HAYVAR_LLAVE.'
      : 'No se pudo cargar: ' + e.message);
  }

  $('#app').innerHTML = `
    <header>
      <b>HAYVAR</b><span class="et">administración</span>
      <div class="der">
        <span id="cuando"></span>
        <button onclick="cargar()">Actualizar</button>
      </div>
    </header>
    <main>
      <h2>Quién está entrando hoy</h2>
      ${visitasHoy(vis)}
      <h2>Los últimos catorce días</h2>
      ${dias(vis)}
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;margin-top:14px">
        <div><h2 style="margin-top:0">De dónde vienen</h2>${listado('', vis.fuentes)}</div>
        <div><h2 style="margin-top:0">Qué páginas miran</h2>${listado('', vis.paginas)}</div>
        <div><h2 style="margin-top:0">Desde qué país tienen el navegador</h2>${listado('', vis.regiones)}</div>
        <div><h2 style="margin-top:0">Con qué entran</h2>${listado('', vis.dispositivos)}</div>
        <div><h2 style="margin-top:0">Sistema</h2>${listado('', vis.sistemas)}</div>
        <div><h2 style="margin-top:0">Resolución</h2>${listado('', vis.pantallas)}</div>
        <div><h2 style="margin-top:0">A qué llegan desde un buscador</h2>${listado('', vis.aterrizajes,
          'Todavía no llegó nadie por Google. Cuando lleguen, acá se ve a qué página los mandó: es lo más cerca que se puede estar de saber qué escribieron.')}</div>
        <div><h2 style="margin-top:0">Palabras que sí llegaron</h2>${listado('', vis.busquedas,
          'Google borra los términos de búsqueda desde 2011: nunca van a aparecer los suyos. Acá salen los pocos buscadores que todavía los mandan. Las palabras exactas de Google están en Search Console, gratis.')}</div>
        <div><h2 style="margin-top:0">Qué torneo venían a ver</h2>${listado('', vis.intenciones,
          'Se deduce de la página en la que aterrizan. Es lo que puede ordenar la portada cuando lo enciendas.')}</div>
      </div>
      <h2>Las últimas visitas</h2>
      ${ultimas(vis)}
      <footer>${esc(vis.comoSeCuenta || '')}</footer>

      <h2>El servidor</h2>
      ${salud(t, base, diag)}
      <h2>La tabla de partidos</h2>
      ${tablaDePartidos(base)}
      <h2>Qué ocupa el disco</h2>
      ${queOcupa(base)}
      <h2>Copias de la base</h2>
      <div id="copias">${listaDeCopias((cop || {}).copias)}</div>
      <h2>Cuánto tarda cada cosa</h2>
      ${tiempos(t)}
      <h2>Qué hay guardado</h2>
      ${contenido(cont)}
      <h2>Cuánto lleva bajado cada torneo</h2>
      ${recorrido(rec)}
      ${nom ? `<h2>Clubes que se confunden con otro</h2>
        ${nombres(nom)}
        <h2>Corregir los que quedaron mal guardados</h2>
        <div id="corregir"><div style="padding:12px 0">
          <button onclick="corregir()">Ver qué cambiaría</button></div></div>` : ''}
      ${col ? `<h2>¿Sirve sacar los colores del escudo?</h2>
        ${colores(col)}` : ''}
      <footer>Base: ${esc(base.archivo || '—')}${
        base.sobrevive_al_deploy ? ' · sobrevive a las publicaciones' : ''}</footer>
    </main>`;
  $('#cuando').textContent = 'al ' + new Date().toLocaleTimeString('es-AR');
}

if(LLAVE) cargar(); else pedirLlave('');
</script>
</body>
</html>
