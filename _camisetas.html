    const k = (atras && k0.espalda) ? Object.assign({}, k0, k0.espalda) : k0;
    const u = Math.random().toString(36).slice(2, 8);

  /* La camiseta.

       River tiene un hilo negro a cada lado de cada bastón rojo— y sin eso

      }

    /* Mirada de atrás, la diagonal cae para el otro lado: es la misma

    if(k.patron === 'banda'){
      const inv = atras ? !k.invertida : k.invertida;

    /* Franjas horizontales, con dos medidas: `alto` es el grosor y `hueco`

            hueco = (k.hueco == null ? alto : k.hueco), paso = alto + hueco;
      for(let i = 0; i * paso < 224; i++)
        p += franja(14 + i * paso, alto, i % 2 ? otra : k.raya);
    }
    if(k.patron === 'doblefranja')            // la suplente de Tigre
      p = franja(58, 18, k.raya) + franja(80, 18, k.raya2 || k.raya);
    if(k.patron === 'mitades')                // partida al medio: Newell's
      p = `<rect x="115" y="12" width="72" height="224" fill="${k.raya}"/>`;
    if(k.patron === 'uve')                    // la V de Vélez
      p = `<path d="M66 32 L115 150 L164 32 L142 32 L115 108 L88 32 Z"
             fill="${k.raya}"/>`;
    if(k.patron === 'centro')                 // la vertical de Huracán
      p = vertical(98, 34, k.raya) + vertical(88, 4, k.raya)
        + vertical(138, 4, k.raya);
    if(k.patron === 'vivo')                   // los dos de Argentinos
      p = vertical(140, 5, k.raya) + vertical(150, 5, k.raya);
    /* Un bastón central ancho partido al medio, más dos laterales finos:
       la titular de Talleres 2026. El corte del medio lo abre en dos, así
       que de lejos se lee como una franja gruesa con un hilo adentro y no
       como dos bastones sueltos. */
    /* Un paño en diagonal del hombro a la axila, en un tono del mismo
       color: no es una franja de otro color sino un corte de la tela que
       se ve por cómo pega la luz. La suplente de Talleres tiene una a cada
       lado. Va con el diseño, no encima: por eso entra acá. */
    /* Una diagonal gruesa de un hombro a la axila de enfrente. Es un solo
       paño cruzado, no dos cuñas simétricas: la suplente de Talleres tiene
       una sola y cruzarla dos veces la convertía en otra camiseta. */
    /* Un paño cruzado de un hombro a la axila de enfrente, difuminado en
       los dos bordes: no es una franja pegada sino la tela que cambia de
       tono. Y no siempre está atrás —la suplente de Talleres la tiene sólo
       adelante— así que `soloAdelante` la saca de la espalda. */
    if(k.diagonal && !(atras && k.diagonalSoloAdelante))
      p += k.diagonalInvertida
        ? `<path d="M170 4 L40 124 L40 168 L170 52 Z" fill="url(#dg${u})"/>`
        : `<path d="M60 4 L190 124 L190 168 L60 52 Z" fill="url(#dg${u})"/>`;
    /* La titular de Talleres, de adentro hacia afuera: una franja central
       gruesa que en el medio pierde el azul y se funde con el blanco del
       resto, dos bastones más finos a los costados, blanco, y los laterales
       azules que bajan de la manga hasta el ruedo.

       El desvanecido del medio es un degradé y no una línea blanca: son dos
       cosas distintas y de lejos se notan. */
    /* La titular de Talleres. Un blanco horizontal se come casi todo el
       pecho: arriba de él sólo sigue la franja gruesa del medio, y los
       bastones finos y los laterales recién arrancan más abajo, saliendo
       del desvanecido.

       Por eso la franja central se dibuja entera y el resto desde el pecho
       para abajo: el blanco no está pintado encima de un diseño completo,
       es que arriba no hay diseño. */
    if(k.patron === 'bastoncentral'){
      const desde = 132;
      const bajo = (x, an) =>
        `<rect x="${x}" y="${desde}" width="${an}" height="${236 - desde}"
          fill="${k.raya}"/>`;
      p  = vertical(102, 26, k.raya);
      p += bajo(86, 9) + bajo(135, 9);
      p += bajo(50, 22) + bajo(158, 22);
      p += `<rect x="40" y="60" width="150" height="88" fill="url(#fd${u})"/>`;
    }

    /* El cuello. Atrás no hay ni pico ni polo: se ve la cinta que remata la
       nuca, que es lo único que se ve de un cuello desde atrás. */
    const cuelloBanda = `<path d="M97 20 Q115 31 133 20 L135 16 Q115 28 95 16 Z"
        fill="${k.cuello || det}"/>`;
    const cuello = atras ? cuelloBanda : (
      k.cuelloTipo === 'v'
        ? `<path d="M101 20 L115 48 L129 20 L124 18.5 L115 39 L106 18.5 Z"
             fill="${k.cuello || det}"/>`
      : k.cuelloTipo === 'polo'
        // tapeta con dos botones y las dos puntas del cuello abiertas
        ? `<path d="M108 24 L122 24 L121 62 L109 62 Z" fill="${k.cuello || det}"/>
           <path d="M115 24 L115 62" stroke="rgba(0,0,0,.22)" stroke-width="1.2"/>
           <circle cx="115" cy="36" r="1.9" fill="rgba(0,0,0,.35)"/>
           <circle cx="115" cy="50" r="1.9" fill="rgba(0,0,0,.35)"/>
           <path d="M98 20 Q106 21 110 26 L104 40 Q95 30 93 23 Z"
             fill="${k.cuello || det}"/>
           <path d="M132 20 Q124 21 120 26 L126 40 Q135 30 137 23 Z"
             fill="${k.cuello || det}"/>`
        : `<path d="M99 20 Q115 33 131 20 L134 23.5 Q115 38 96 23.5 Z"
             fill="${k.cuello || det}"/>`);

    return `<svg viewBox="0 0 230 260" width="150" height="170" aria-hidden="true">
      <defs>
        <clipPath id="c${u}"><path d="${CUERPO}"/></clipPath>
        <clipPath id="i${u}"><path d="${MANGA_I}"/></clipPath>
        <clipPath id="d${u}"><path d="${MANGA_D}"/></clipPath>
        <clipPath id="t${u}"><path d="${CUERPO}"/><path d="${MANGA_I}"/>
          <path d="${MANGA_D}"/></clipPath>

        <!-- la trama del tejido: hilos finitos que a este tamaño se leen
             como textura y no como líneas -->
        <pattern id="w${u}" width="4" height="4" patternUnits="userSpaceOnUse">
          <path d="M0 0 V4" stroke="#ffffff" stroke-opacity=".055" stroke-width="1"/>
          <path d="M0 0 H4" stroke="#000000" stroke-opacity=".045" stroke-width="1"/>
        </pattern>

        ${k.diagonal ? `
        <linearGradient id="dg${u}" gradientUnits="userSpaceOnUse"
          x1="${k.diagonalInvertida ? 170 : 60}" y1="4"
          x2="${k.diagonalInvertida ? 40 : 190}" y2="168">
          <stop offset="0" stop-color="${k.diagonal}" stop-opacity="0"/>
          <stop offset=".3" stop-color="${k.diagonal}" stop-opacity=".95"/>
          <stop offset=".7" stop-color="${k.diagonal}" stop-opacity=".95"/>
          <stop offset="1" stop-color="${k.diagonal}" stop-opacity="0"/>
        </linearGradient>` : ''}
        ${k.patron === 'bastoncentral' ? `
        <linearGradient id="fd${u}" gradientUnits="userSpaceOnUse"
          x1="0" y1="60" x2="0" y2="148">
          <stop offset="0" stop-color="${k.base}" stop-opacity="0"/>
          <stop offset=".22" stop-color="${k.base}" stop-opacity="1"/>
          <stop offset=".62" stop-color="${k.base}" stop-opacity="1"/>
          <stop offset="1" stop-color="${k.base}" stop-opacity="0"/>
        </linearGradient>` : ''}

        <!-- el volumen del cuerpo: un cilindro iluminado en el medio.
             Va en coordenadas del dibujo y no proporcionales, así el claro
             cae en el pecho y no donde termine la caja del SVG. -->
        <linearGradient id="lat${u}" gradientUnits="userSpaceOnUse"
          x1="65" y1="0" x2="165" y2="0">
          <stop offset="0" stop-color="#000000" stop-opacity=".26"/>
          <stop offset=".10" stop-color="#000000" stop-opacity=".09"/>
          <stop offset=".28" stop-color="#ffffff" stop-opacity=".10"/>
          <stop offset=".44" stop-color="#ffffff" stop-opacity=".15"/>
          <stop offset=".64" stop-color="#ffffff" stop-opacity=".06"/>
          <stop offset=".86" stop-color="#000000" stop-opacity=".12"/>
          <stop offset="1" stop-color="#000000" stop-opacity=".28"/>
        </linearGradient>
        <!-- la sombra abajo del cuello y la caída del ruedo -->
        <linearGradient id="ver${u}" gradientUnits="userSpaceOnUse"
          x1="0" y1="19" x2="0" y2="234">
          <stop offset="0" stop-color="#000000" stop-opacity=".20"/>
          <stop offset=".14" stop-color="#000000" stop-opacity="0"/>
          <stop offset=".78" stop-color="#000000" stop-opacity="0"/>
          <stop offset="1" stop-color="#000000" stop-opacity=".17"/>
        </linearGradient>
        <!-- donde el brazo se junta con el cuerpo -->
        <radialGradient id="axi${u}" gradientUnits="userSpaceOnUse"
          cx="70" cy="60" r="30">
          <stop offset="0" stop-color="#000000" stop-opacity=".26"/>
          <stop offset="1" stop-color="#000000" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="axd${u}" gradientUnits="userSpaceOnUse"
          cx="160" cy="60" r="30">
          <stop offset="0" stop-color="#000000" stop-opacity=".26"/>
          <stop offset="1" stop-color="#000000" stop-opacity="0"/>
        </radialGradient>
        <!-- las mangas: se apagan contra el borde de afuera -->
        <linearGradient id="mi${u}" gradientUnits="userSpaceOnUse"
          x1="37" y1="0" x2="80" y2="0">
          <stop offset="0" stop-color="#000000" stop-opacity=".28"/>
          <stop offset=".55" stop-color="#000000" stop-opacity=".05"/>
          <stop offset="1" stop-color="#ffffff" stop-opacity=".07"/>
        </linearGradient>
        <linearGradient id="md${u}" gradientUnits="userSpaceOnUse"
          x1="193" y1="0" x2="150" y2="0">
          <stop offset="0" stop-color="#000000" stop-opacity=".28"/>
          <stop offset=".55" stop-color="#000000" stop-opacity=".05"/>
          <stop offset="1" stop-color="#ffffff" stop-opacity=".07"/>
        </linearGradient>
      </defs>

      <path d="${MANGA_I}" fill="${manga}"/>
      <path d="${MANGA_D}" fill="${manga}"/>
      <path d="${CUERPO}" fill="${k.base}"/>
      <g clip-path="url(#c${u})">${p}</g>
      ${k.hombro ? `<g clip-path="url(#t${u})"><path
        d="M62 28 Q115 46 168 28 L168 12 L62 12 Z" fill="${k.hombro}"/></g>` : ''}

      <!-- los remates: cintas con su costura, no una línea encima -->
      ${k.mangaBanda ? `
      <g clip-path="url(#i${u})">
        ${k.mangaHilo ? `<path d="M78 28 Q58 33 48 46 Q38 62 37 88"
          stroke="${k.mangaHilo}" stroke-width="22" fill="none"/>` : ''}
        <path d="M78 28 Q58 33 48 46 Q38 62 37 88" stroke="${k.mangaBanda}"
          stroke-width="15" fill="none"/>
      </g>
      <g clip-path="url(#d${u})">
        ${k.mangaHilo ? `<path d="M152 28 Q172 33 182 46 Q192 62 193 88"
          stroke="${k.mangaHilo}" stroke-width="22" fill="none"/>` : ''}
        <path d="M152 28 Q172 33 182 46 Q192 62 193 88" stroke="${k.mangaBanda}"
          stroke-width="15" fill="none"/>
      </g>` : ''}
      <g clip-path="url(#i${u})">
        <path d="M30 88 L70 97" stroke="${puno}" stroke-width="7" fill="none"/>
        <path d="M30 84 L70 93" stroke="rgba(0,0,0,.18)" stroke-width="1" fill="none"/>
      </g>
      <g clip-path="url(#d${u})">
        <path d="M200 88 L160 97" stroke="${puno}" stroke-width="7" fill="none"/>
        <path d="M200 84 L160 93" stroke="rgba(0,0,0,.18)" stroke-width="1" fill="none"/>
      </g>
      <g clip-path="url(#c${u})">
        ${k.ruedo ? `<path d="M60 216 Q115 226 170 216" stroke="${k.ruedo}"
          stroke-width="7" fill="none"/>` : ''}
        <path d="M60 213 Q115 223 170 213" stroke="rgba(0,0,0,.13)"
          stroke-width="1" fill="none"/>
      </g>

      <g clip-path="url(#t${u})">
        <rect x="0" y="0" width="230" height="260" fill="url(#w${u})"/>
        <!-- los pliegues: dos caídas anchas a los costados del pecho y dos
             marcas finas donde la tela se junta -->
        <path d="M73 58 Q82 100 76 146" stroke="#000" stroke-opacity=".09"
          stroke-width="12" fill="none"/>
        <path d="M157 58 Q148 100 154 146" stroke="#000" stroke-opacity=".09"
          stroke-width="12" fill="none"/>
        <path d="M95 48 Q91 136 96 214" stroke="#000" stroke-opacity=".05"
          stroke-width="3" fill="none"/>
        <path d="M136 48 Q140 136 135 214" stroke="#000" stroke-opacity=".05"
          stroke-width="3" fill="none"/>
        <rect x="0" y="0" width="230" height="260" fill="url(#lat${u})"/>
        <rect x="0" y="0" width="230" height="260" fill="url(#ver${u})"/>
        <rect x="0" y="0" width="230" height="260" fill="url(#axi${u})"/>
        <rect x="0" y="0" width="230" height="260" fill="url(#axd${u})"/>
      </g>
      <g clip-path="url(#i${u})">
        <rect x="0" y="0" width="230" height="260" fill="url(#mi${u})"/>
      </g>
      <g clip-path="url(#d${u})">
        <rect x="0" y="0" width="230" height="260" fill="url(#md${u})"/>
      </g>

      ${cuello}
      ${atras ? `<path d="M92 30 Q115 38 138 30" stroke="rgba(0,0,0,.14)"
        stroke-width="1.4" fill="none"/>` : ''}
      <path d="${MANGA_I}" fill="none" stroke="rgba(0,0,0,.30)" stroke-width="1.6"/>
      <path d="${MANGA_D}" fill="none" stroke="rgba(0,0,0,.30)" stroke-width="1.6"/>
      <path d="${CUERPO}" fill="none" stroke="rgba(0,0,0,.32)" stroke-width="1.8"/>
    </svg>`;
  }

function pintar(){
  const atras=document.body.classList.contains('atras');
  document.getElementById('g').innerHTML=KITS.map(function(t){
    return '<div class="caja"><div class="par">'
      + '<div class="antes"><div class="rot">antes</div>'+camisetaVieja(t.k,atras)+'</div>'
      + '<div><div class="rot">ahora</div>'+camisetaNueva(t.k,atras)+'</div>'
      + '</div><div class="nom">'+t.club+'</div>'
      + '<div class="kit">'+t.kit+(atras?' · espalda':'')+'</div></div>';
  }).join('');
}
function soloNuevas(si){
  document.body.classList.toggle('solo-nueva',si);
  document.getElementById('b1').classList.toggle('on',!si);
  document.getElementById('b2').classList.toggle('on',si);
}
function verAtras(){ document.body.classList.toggle('atras'); pintar(); }
pintar();
</script></html>
