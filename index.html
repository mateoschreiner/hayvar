  /* ── Gráfico de las estadísticas que definen un partido ─────────────── */
  // Elegí estas cinco: posesión y remates dicen quién manejó el partido,
  // los remates al arco y las ocasiones claras dicen quién lo mereció, y
  // los córners son el mejor indicador de presión sostenida.
  // Los nombres son los que manda 365scores en español. Ojo que dice
  // "Grandes chances" y "Saques de Esquina", no "ocasiones" ni "córners":
  // por eso al radar le faltaban dos puntas.
  const CLAVE=[
    ['Posesión',        'POS', ['posesion','ball possession']],
    ['Remates',         'REM', ['total remates','remates totales','total shots']],
    ['Al arco',         'ARC', ['remates al arco','al arco','shots on goal']],
    ['Chances claras',  'CHA', ['grandes chances','big chances','grandes ocasiones','ocasiones']],
    ['Córners',         'COR', ['saques de esquina','corner','tiros de esquina']],
  ];

  // Si alguna de las cinco no viene, se completa con estas para que el
  // pentágono nunca quede cojo.
  const SUPLENTES=[
    ['Ataques',   'ATQ', ['ataques','attacks']],
    ['Pases',     'PAS', ['pases completados','total de pases','pass']],
    ['Duelos',    'DUE', ['duelos ganados','duels won']],
    ['Regates',   'REG', ['regates','dribbles']],
  ];

  /* ── Colores del radar ────────────────────────────────────────────────
     Usar el color del club tal cual falla en dos casos: los blancos y
     celestes claros desaparecen sobre el fondo, y dos equipos parecidos
     —Racing contra Belgrano, Argentinos contra River— quedan iguales y no
     se distingue un polígono del otro. Así que se oscurece lo muy claro y,
     si los dos siguen pareciéndose, al visitante se le busca el segundo
     color del club o se lo lleva a un gris que siempre contrasta.        */
  function coloresDelGrafico(m){
    const rgb=h=>{const n=parseInt(String(h||'#888').slice(1),16);
      return [(n>>16)&255,(n>>8)&255,n&255];};
    const hex=([r,g,b])=>'#'+[r,g,b].map(v=>Math.max(0,Math.min(255,Math.round(v)))
      .toString(16).padStart(2,'0')).join('');
    const luz=c=>{const [r,g,b]=rgb(c);return (0.299*r+0.587*g+0.114*b)/255;};
    const oscurecerHasta=(c,objetivo)=>{
      let v=rgb(c), i=0;
      while(luz(hex(v))>objetivo && i++<20) v=v.map(x=>x*0.88);
      return hex(v);
    };
    const distancia=(a,b)=>{const A=rgb(a),B=rgb(b);
      return Math.sqrt((A[0]-B[0])**2+(A[1]-B[1])**2+(A[2]-B[2])**2);};

    // Si el color principal es blanco no se lo oscurece a gris —quedarían
    // todos iguales—: se usa el segundo del club, que es el que la gente
    // asocia igual. River y Huracán van en rojo, Vélez en azul.
    const util=cols=>{
      const [a,b]=cols||[];
      if(a && luz(a)<=0.68) return a;
      if(b && luz(b)<=0.68) return b;
      return a ? oscurecerHasta(a,0.55) : '#6b7285';
    };
    let cl=util(m.home.colores||['#2f6fed']);
    let cv=util(m.away.colores||['#9aa1b3']);

    if(distancia(cl,cv)<70){
      const alt=(m.away.colores||[]).map(c=>c).find(c=>c&&luz(c)<=0.68&&distancia(cl,c)>=70);
      cv = alt || (luz(cl)<0.5 ? '#c9ced9' : '#2b3242');
    }
    return [cl,cv];
  }

  function graficoClave(stats,m){
    // Se toman las cinco de siempre y, si alguna no vino, se completa con
    // las suplentes: el pentágono siempre tiene que cerrar con cinco puntas.
    const usadas=new Set();
    const tomar=([titulo,corto,claves])=>{
      const s=elegir(stats,claves,usadas);
      if(!s) return null;
      usadas.add(s.label);
      return {titulo,corto,h:s.h,a:s.a,hp:s.hp,ap:s.ap};
    };
    const filas=CLAVE.map(tomar).filter(Boolean);
    for(const sup of SUPLENTES){
      if(filas.length>=5) break;
      const f=tomar(sup);
      if(f) filas.push(f);
    }
    if(filas.length<3) return '';   // con menos de tres no vale la pena

    const local=esc(m.home.canon||m.home.name), visita=esc(m.away.canon||m.away.name);
    const [cl,cv]=coloresDelGrafico(m);

    // ── El radar ──
    // Cada eje es una estadística y el valor es el porcentaje que le tocó a
    // cada equipo, así el gráfico se lee de una: el polígono más grande es
    // el que dominó ese aspecto.
    const N=filas.length, R=78, CX=110, CY=100;
    const punto=(i,r)=>{
      const ang=-Math.PI/2 + i*2*Math.PI/N;
      return [CX+Math.cos(ang)*r, CY+Math.sin(ang)*r];
    };
    const poly=vals=>vals.map((v,i)=>punto(i,Math.max(8,R*v/100)).map(n=>n.toFixed(1)).join(',')).join(' ');
    const rejilla=[1,.66,.33].map(f=>
      `<polygon points="${filas.map((_,i)=>punto(i,R*f).map(n=>n.toFixed(1)).join(',')).join(' ')}"
        fill="none" stroke="var(--line)" stroke-width="1"/>`).join('');
    const ejes=filas.map((_,i)=>{
      const [x,y]=punto(i,R);
      return `<line x1="${CX}" y1="${CY}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}"
        stroke="var(--line)" stroke-width="1"/>`;
    }).join('');
    const etiquetas=filas.map((f,i)=>{
      const [x,y]=punto(i,R+17);
      const anchor=Math.abs(x-CX)<6?'middle':(x>CX?'start':'end');
      return `<text x="${x.toFixed(1)}" y="${(y+3).toFixed(1)}" text-anchor="${anchor}"
        font-size="9" font-weight="700" fill="var(--txt2)"
        style="text-transform:uppercase;letter-spacing:.5px">${esc(f.corto)}</text>`;
    }).join('');

    return `<div class="clave">
      <div class="clave-top">
        <span class="clave-tit">Lo que definió el partido</span>
        <span class="clave-eqs">
          <span style="display:flex;align-items:center;gap:6px">
            <i class="pt" style="background:${cl}"></i>${local}</span>
          <span style="display:flex;align-items:center;gap:6px">${visita}
            <i class="pt" style="background:${cv}"></i></span>
        </span>
      </div>
      <div class="radar-wrap">
        <svg viewBox="0 0 220 200" class="radar">
          ${rejilla}${ejes}
          <polygon points="${poly(filas.map(f=>f.ap))}" fill="${cv}" fill-opacity=".28"
            stroke="${cv}" stroke-width="2"/>
          <polygon points="${poly(filas.map(f=>f.hp))}" fill="${cl}" fill-opacity=".28"
            stroke="${cl}" stroke-width="2"/>
          ${etiquetas}
        </svg>
        <div class="radar-nums">
          ${filas.map(f=>{
            const hp=Math.max(0,Math.min(100,+f.hp||0));
            const ap=Math.max(0,Math.min(100,+f.ap||0));
            return `<div>
              <div class="rn">
                <b style="color:${cl}">${esc(f.h)}</b>
                <span>${esc(f.titulo)}</span>
                <b style="color:${cv}">${esc(f.a)}</b>
              </div>
              <div class="rn-barra">
                <i style="width:${hp}%;background:${cl}"></i>
                <i style="width:${ap}%;background:${cv}"></i>
              </div>
            </div>`;}).join('')}
        </div>
      </div>
    </div>`;
  }

  /* ── El resto de las estadísticas ─────────────────────────────────────
     365scores manda veinte y pico y la mayoría no le dice nada a nadie
     (saques de banda, despejes, pases hacia atrás). Quedan seis que sí:
     los goles esperados porque resume si el resultado fue justo, la
     precisión de pases porque distingue tener la pelota de saber usarla,
     las atajadas porque explican los partidos que se ganan de atrás, y
     faltas, offsides y amarillas porque cuentan cómo se jugó.            */
  const SECUNDARIAS=[
    ['Goles esperados', ['goles esperados','expected goals']],
    ['Pases completados',['pases completados','pass accuracy']],
    ['Atajadas',        ['salvadas de portero','atajadas','paradas','saves']],
    ['Duelos ganados',  ['duelos ganados','duels won']],
    ['Faltas',          ['faltas','fouls']],
    ['Amarillas',       ['tarjetas amarillas','amarilla','yellow card']],
  ];

  const sinTilde=t=>String(t||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();

  // Primero busca el nombre exacto y sólo después uno que lo contenga. Sin
  // esto, "Faltas" se llevaba "Faltas recibidas", que es lo contrario.
  function elegir(stats,claves,usadas){
    for(const modo of ['exacto','contiene']){
      for(const k of claves){
        const kk=sinTilde(k);
        const s=stats.find(x=>{
          if(usadas.has(x.label)) return false;
          const n=sinTilde(x.label);
          return modo==='exacto' ? n===kk : n.includes(kk);
        });
        if(s) return s;
      }
    }
    return null;
  }

  function secundarias(stats){
    const usadas=new Set(), out=[];
    for(const [titulo,claves] of SECUNDARIAS){
      const s=elegir(stats,claves,usadas);
      if(s){ usadas.add(s.label); out.push({...s,label:titulo}); }
    }
    return out;
  }

  /* El palo era un cuadradito negro y no se entendía nada. Ahora se dibuja
     el ángulo del arco —poste y travesaño— con la pelota rebotando y las
     rayitas del golpe, que es como se lee de un vistazo. */
  const SVG_PALO=`<svg viewBox="0 0 24 24" width="13" height="13" fill="none"
    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
    style="vertical-align:-2px">
    <path d="M5.5 3.5h13M5.5 3.5v17"/>
    <circle cx="13" cy="12.5" r="3.2" fill="currentColor" stroke="none"/>
    <path d="M8 8.6l1.4 1.2M7.6 12.5h1.6M8 16.4l1.4-1.2"/></svg>`;
  const ICONO={gol:'⚽',amarilla:'🟨',roja:'🟥',cambio:'🔁',palo:SVG_PALO};
  const SVG_ESTADIO=`<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor"
    stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:5px">
    <ellipse cx="12" cy="12" rx="9.5" ry="6"/><ellipse cx="12" cy="12" rx="4" ry="2.4"/>
    <path d="M2.5 12v3.2c0 1.7 4.3 3.1 9.5 3.1s9.5-1.4 9.5-3.1V12"/></svg>`;
  const SVG_SILBATO=`<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor"
    stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:5px">
    <circle cx="9" cy="13" r="5.5"/><path d="M14.5 13H22M14.5 10.5h5M9 7.5V4h6"/></svg>`;

  function drawModal(m,loading){
    if(!m) return;
    const lv=m.status==='LIVE';
    const st=lv?`${m.minute??''}' EN VIVO`:m.status==='FIN'?'FINALIZADO':m.status==='SUSP'?'SUSPENDIDO':'PROGRAMADO';
    const d=new Date(m.start);
    // miércoles 5 de agosto + horario original
    const fechaLarga=`${DIAS[d.getDay()]} ${d.getDate()} de ${MESES[d.getMonth()]}`;
    // Si se definió por penales, el 0-0 de arriba no dice quién ganó: va el
    // resultado de la tanda debajo del marcador.
    const tandaCab=((mData&&mData.events)||[]).filter(e=>e.penales&&e.anotado);
    const penTit=tandaCab.length
      ? `<div class="pen-cab">${tandaCab.filter(e=>e.side==='h').length} - ${tandaCab.filter(e=>e.side==='a').length} en penales</div>`
      : '';
    let body;
    if(loading) body='<div class="skel"></div><div class="skel"></div><div class="skel"></div>';
    else if(mData&&mData.error) body=`<div class="empty">No se pudo cargar el detalle.<br><small>${esc(mData.error)}</small></div>`;
    else if(mData&&mData.sinDetalle&&mTab!=='res')
      body=`<div class="empty">365scores sólo guarda el minuto a minuto de las fechas recientes,
        y esta ya salió de esa ventana.<br><br>
        <span style="color:var(--txt3);font-size:12px">El resultado y el árbitro salen de AFA y sí están, en Resumen.</span></div>`;
    else if(mTab==='res'){
      const todos=(mData&&mData.events)||[];
      // la tanda va aparte, abajo: mezclada en el minuto a minuto se pierde
      const tanda=todos.filter(e=>e.penales), ev=todos.filter(e=>!e.penales);
      let cruzado=false;   // para separar los dos tiempos
      body=ev.length?ev.map(e=>{
        const min=`${e.min??''}${e.added?'+'+e.added:''}'`;
        const nom=`<span class="ico">${e.anulado?'🚫':(ICONO[e.type]||'•')}</span> `
          +`<b style="font-weight:600${e.anulado?';text-decoration:line-through;color:var(--txt3)':''}">${esc(e.player||'—')}</b>`
          +(e.anulado?'<span style="color:var(--red);font-size:9.5px;font-weight:800;letter-spacing:.4px"> ANULADO</span>':'')
          +(e.extra?`<span style="color:var(--txt2);font-size:11px"> ${e.type==='cambio'?'▼ ':''}${esc(e.extra)}</span>`:'')
          +(e.sub&&e.type==='gol'&&/contra|penal/i.test(e.sub)?`<span style="color:var(--txt2);font-size:11px"> (${esc(e.sub)})</span>`:'');
        let corte='';
        if(!cruzado&&e.min>45){ cruzado=true; corte='<div class="ht"><span>Entretiempo</span></div>'; }
        return corte+`<div class="ev"><div class="r">${e.side==='h'?nom:''}</div><div class="m">${min}</div><div>${e.side==='a'?nom:''}</div></div>`;
      }).join(''):'<div class="empty">Sin eventos registrados.</div>';

      // ── Definición por penales ──
      if(tanda.length){
        const cuenta=s=>tanda.filter(e=>e.side===s&&e.anotado).length;
        const pat=e=>`<div class="pen-pat ${e.anotado?'ok':'no'}">
          <span class="tic">${e.anotado?'✓':'✗'}</span>
          <span class="nm">${esc(e.player||'—')}</span></div>`;
        body+=`<div class="pen-bloque">
          <div class="pen-tit"><span>Definición por penales</span>
            <b>${cuenta('h')}-${cuenta('a')}</b></div>
          <div class="pen-cols">
            <div>${tanda.filter(e=>e.side==='h').map(pat).join('')||'<div class="pen-vacio">—</div>'}</div>
            <div>${tanda.filter(e=>e.side==='a').map(pat).join('')||'<div class="pen-vacio">—</div>'}</div>
          </div></div>`;
      }
      const pie=[];
      if(m.referee) pie.push(`${SVG_SILBATO}Árbitro: <b style="font-weight:600">${esc(m.referee)}</b>`);
      if(m.venue) pie.push(`${SVG_ESTADIO}${esc(m.venue)}${m.capacidad?` · ${m.capacidad.toLocaleString('es-AR')} espectadores`:''}`);
      if(pie.length) body+=`<div style="margin-top:14px;padding-top:11px;border-top:1px solid var(--line);
        font-size:12px;color:var(--txt2);display:flex;flex-direction:column;gap:5px">${pie.map(x=>`<div>${x}</div>`).join('')}</div>`;
    }
    else if(mTab==='sta'){
      const ss=(mData&&mData.stats)||[];
      const resto=secundarias(ss);
      body=ss.length ? graficoClave(ss,m)
        + (resto.length?`<div class="subt" style="margin-top:4px">El resto del partido</div>`:'')
        + resto.map(s=>`<div class="stat">
            <div class="lb"><b>${esc(s.h)}</b><span class="c">${esc(s.label)}</span><b>${esc(s.a)}</b></div>
            <div class="bar"><i style="width:${s.hp}%"></i><i style="width:${s.ap}%"></i></div></div>`).join('')
        :'<div class="empty">Sin estadísticas disponibles.</div>';
    }
    else{
      const lu=(mData&&mData.lineups)||{home:[],away:[]};
      const bc=(mData&&mData.banco)||{home:[],away:[]};
      const fm=(mData&&mData.formation)||{};

      // Lo que le pasó a cada jugador, sacado de los eventos del partido:
      // goles, tarjetas y a qué minuto entró o salió.
      const porJugador={};
      const anotar=(nombre,ico)=>{ if(!nombre) return;
        (porJugador[nombre]=porJugador[nombre]||[]).push(ico); };
      ((mData&&mData.events)||[]).forEach(e=>{
        const min=`${e.min??''}${e.added?'+'+e.added:''}'`;
        if(e.type==='gol'){
          const contra=/contra/i.test(e.sub||'');
          anotar(e.player,`<span title="${contra?'Gol en contra':'Gol'} · ${min}">${contra?'⚽̶':'⚽'}</span>`);
        }
        else if(e.type==='amarilla') anotar(e.player,`<span title="Amarilla · ${min}">🟨</span>`);
        else if(e.type==='roja')     anotar(e.player,`<span title="Roja · ${min}">🟥</span>`);
        else if(e.type==='cambio'){
          anotar(e.player,`<span style="color:var(--live)" title="Entró · ${min}">▲</span>`);
          (e.extra||'').split(',').map(x=>x.trim()).forEach(x=>
            anotar(x,`<span style="color:var(--red)" title="Salió · ${min}">▼</span>`));
        }
      });
      const iconos=n=>{const v=porJugador[n];
        return v?` <span style="font-size:11px;letter-spacing:1px">${v.join('')}</span>`:'';};

      // 365scores le pone el dorsal -1 al entrenador. Va aparte, al pie de
      // cada columna, con la sigla DT en lugar del número.
      const esDT=p=>String(p.n)==='-1'||/entrenador|director t/i.test(p.puesto||p.pos||'');
      const lista=(arr,dt)=>arr.map(p=>
        `<li onclick="event.stopPropagation();App.jugador('${js(p.name)}',${p.id||'null'})"
             style="cursor:pointer"><b>${dt?'DT':(p.n??'')}</b><span${dt?' style="font-weight:700"':''}>${esc(p.name)}</span>${iconos(p.name)}</li>`).join('');

      // ── La cancha ──
      // Cada jugador trae x (0 izquierda, 100 derecha) e y (0 línea propia,
      // 100 arco rival). El local se dibuja de abajo hacia arriba y el
      // visitante espejado, como se ve una transmisión.
      // el color del club en cada bolita; si tiene dos, mitad y mitad
      const pinta=(cols,arriba)=>{
        if(!cols||!cols.length) return arriba?'background:#111;color:#fff'
                                             :'background:#fff;color:#111';
        const [a,bb]=cols;
        const oscuro=h=>{const n=parseInt(h.slice(1),16);
          return (0.299*((n>>16)&255)+0.587*((n>>8)&255)+0.114*(n&255))/255<.55;};
        const fondo = bb&&bb!==a
          ? `background:linear-gradient(90deg,${a} 0 50%,${bb} 50% 100%)`
          : `background:${a}`;
        return `${fondo};color:${oscuro(a)?'#fff':'#111'}`;
      };
      const colLoc=pinta((m.home||{}).colores,false), colVis=pinta((m.away||{}).colores,true);

      // Cancha horizontal: el local ataca hacia la derecha y el visitante
      // hacia la izquierda, como se ve una transmisión. La profundidad del
      // jugador (p.y) pasa a ser el eje X, y el costado (p.x) el eje Y.
      const ficha=(p,visitante)=>{
        if(p.x==null||p.y==null) return '';
        // se deja un pasillo en el medio para que las dos líneas
        // adelantadas no se amontonen contra el círculo central
        const prof = visitante ? 91 - (p.y/2)*0.62 : 9 + (p.y/2)*0.62;
        const lado = visitante ? 100-p.x : p.x;
        const y = 10 + lado*0.80;
        const ap=p.name.split(' ').slice(-1)[0];
        return `<div class="jug ${visitante?'vis':'loc'}" style="left:${prof}%;top:${y}%"
          onclick="event.stopPropagation();App.jugador('${js(p.name)}',${p.id||'null'})"
          title="${esc(p.name)}${p.puesto?' · '+esc(p.puesto):''}">
          <span class="dorsal" style="${visitante?colVis:colLoc}">${p.n??''}</span>
          <span class="ape">${esc(ap)}${iconos(p.name)}</span></div>`;
      };
      const hayCancha=[...lu.home,...lu.away].some(p=>p.x!=null);
      const cancha=hayCancha?`<div class="cancha">
        <div class="lineas"></div>
        ${lu.home.map(p=>ficha(p,false)).join('')}
        ${lu.away.map(p=>ficha(p,true)).join('')}
        <div class="eq-nom izq">${esc(m.home.canon||m.home.name)}${fm.home?' · '+esc(fm.home):''}</div>
        <div class="eq-nom der">${esc(m.away.canon||m.away.name)}${fm.away?' · '+esc(fm.away):''}</div>
      </div>`:'';
      // Antes de que se confirme el once, 365scores manda el plantel entero
      // sin marcar titulares y el banco quedaba con veinte nombres. Mientras
      // no haya once titulares no se publica como "Suplentes": se avisa.
      const conf=(mData&&mData.confirmada)||{}, real=(mData&&mData.bancoReal)||{};
      const col=(xi,banco,f,nm,onceOk,bancoOk)=>{
        const dts=[...xi,...banco].filter(esDT);
        const tit=xi.filter(p=>!esDT(p)), sup=banco.filter(p=>!esDT(p));
        return `<div>
        <h5>${esc(nm)}${f?' · '+esc(f):''}</h5>
        ${onceOk?'':`<div style="font-size:10.5px;color:var(--txt2);margin:-2px 0 5px">
          La formación todavía no está confirmada</div>`}
        <ul>${tit.length?lista(tit):'<li style="color:var(--txt2)">Formación no publicada</li>'}</ul>
        ${sup.length?(bancoOk
          ? `<h5 style="margin-top:12px">Suplentes</h5><ul style="opacity:.75">${lista(sup)}</ul>`
          : `<h5 style="margin-top:12px">Resto del plantel</h5>
             <div style="font-size:10.5px;color:var(--txt2);margin:-2px 0 4px">
               El banco todavía no está publicado</div>
             <ul style="opacity:.6">${lista(sup)}</ul>`):''}
        ${dts.length?`<ul style="margin-top:10px;border-top:1px solid var(--line);padding-top:8px">
          ${lista(dts,true)}</ul>`:''}</div>`;
      };
      body=cancha+`<div class="xi">
        ${col(lu.home,bc.home,fm.home,m.home.canon||m.home.name,conf.home!==false,real.home!==false)}
        ${col(lu.away,bc.away,fm.away,m.away.canon||m.away.name,conf.away!==false,real.away!==false)}</div>`;
    }

    $('#modalBox').innerHTML=`
      <div class="mhead">
        <div class="top">
          <span>Clausura 2026 · Fecha ${m.round??''} · ${m.interzonal?'Interzonal':'Zona '+(m.zone??'')}</span>
          <span>${esc(fechaLarga)} · ${hhmm(m.start)} hs</span>
          <button class="x" onclick="App.closeModal()">×</button>
        </div>
        <div class="mscore">
          <div class="t">${crest(m.home,46,true)}<span>${esc(m.home.canon||m.home.name)}</span></div>
          <div class="sc"><div class="n">${m.gh==null?'– –':m.gh+' - '+m.ga}</div>
            ${penTit}<div class="s ${lv?'live':''}">${st}</div></div>
          <div class="t">${crest(m.away,46,true)}<span>${esc(m.away.canon||m.away.name)}</span></div>
        </div>
      </div>
      <div class="tabs" style="padding:0 8px">
        <button class="${mTab==='res'?'on':''}" onclick="App.mtab('res')">Resumen</button>
        <button class="${mTab==='sta'?'on':''}" onclick="App.mtab('sta')">Estadísticas</button>
        <button class="${mTab==='xi'?'on':''}" onclick="App.mtab('xi')">Formaciones</button>
      </div>
      <div class="mbody">${body}</div>`;
  }

  /* ── carga y polling ── */
  /* ── otra liga (Primera Nacional): tablas y fixture, sin vivo ── */
  // Sigla corta para el cuadradito de la zona. Los nombres largos —"Zona
  // Reválida - A" en el Federal A— no entran y se desbordaban.
  function sigla(z){
    const t=String(z||'').trim();
    if(t.length<=3) return t.toUpperCase();
    const fin=t.match(/[-–]\s*([A-Za-z0-9]{1,2})\s*$/);      // "... - A"
    if(fin) return fin[1].toUpperCase();
    const sola=t.match(/\b([A-Z0-9])\b\s*$/);                // "... A"
    if(sola) return sola[1].toUpperCase();
    return t.replace(/zona|grupo/ig,'').trim().slice(0,3).toUpperCase()||'—';
  }

  // agrupa los partidos de la fecha por zona (sirve para cualquier liga)
  function pintarFecha(){
    // con fases, la fecha 3 de la reválida y la 3 de la primera fase son
    // distintas: hay que filtrar por las dos cosas
    const dela=S.games.filter(m=>String(m.round)===String(S.round)
      && (!S.fasesLiga || S.fase==null || m.fase===S.fase));
    const etapa=S.etapas&&S.etapas[S.round-1];
    if(!dela.length) return $('#matches').innerHTML=`<div class="empty">
      <span class="big">◎</span>${etapa?esc(etapa)+': todavía sin definir.':'Sin partidos para esta fecha.'}</div>`;

    // En las eliminatorias no hay zonas: se agrupa por ida y vuelta, que es
    // como se sigue una llave.
    if(dela.some(m=>m.tramo)){
      const tramos={Ida:[],Vuelta:[],'':[]};
      dela.forEach(m=>(tramos[m.tramo||'']=tramos[m.tramo||'']||[]).push(m));
      // idas y vueltas plegables, igual que los grupos
      return void($('#matches').innerHTML=['Ida','Vuelta',''].map(t=>{
        const ms=tramos[t]||[]; if(!ms.length) return '';
        if(!t) return ms.map(matchRow).join('');
        const cerrado=S.grupoAbierto?S.grupoAbierto!==t:false;
        return `<div class="zhead plegable" onclick="App.grupo('${t}')">
            <span class="badge">${t==='Ida'?'I':'V'}</span>
            <span class="nm">Partidos de ${t.toLowerCase()}</span>
            <span class="flecha">${cerrado?'▸':'▾'}</span></div>`
          + (cerrado?'':ms.map(matchRow).join(''));
      }).join(''), cargarDetalles());
    }

    const zonas={};
    dela.forEach(m=>{const k=m.interzonal?'X':(m.zone||'—');(zonas[k]=zonas[k]||[]).push(m);});
    const orden=Object.keys(zonas).sort((a,b)=>a==='X'?-1:b==='X'?1:a.localeCompare(b));
    const una=orden.length===1;
    // Los grupos de una copa son ocho listas largas: arrancan plegadas menos
    // la primera, así se ve el panorama sin scrollear una eternidad.
    const plegable=S.etapas&&orden.length>2;
    $('#matches').innerHTML=orden.map((z,i)=>{
      const inter=z==='X';
      const cerrado=plegable&&(S.grupoAbierto?S.grupoAbierto!==z:i>0);
      return (una?'':`<div class="zhead${plegable?' plegable':''}"${plegable?` onclick="App.grupo('${js(z)}')"`:''}>
          <span class="badge"${inter?' style="background:#ff3b30"':''}>${inter?'↔':esc(sigla(z))}</span>
          <span class="nm">${inter?'Interzonal':(/zona|grupo/i.test(z)?esc(z):'Zona '+esc(z))}</span>
          ${plegable?`<span class="flecha">${cerrado?'▸':'▾'}</span>`:''}</div>`)
        + (cerrado?'':zonas[z].map(matchRow).join(''));
    }).join('');
    cargarDetalles();
  }

  async function loadOtra(){
    shell(); drawSide();
    $('#right').innerHTML='<div class="skel"></div><div class="skel"></div>';
    $('#matches').innerHTML='<div class="skel" style="width:55%"></div><div class="skel"></div>';
    let d,g;
    try{ [d,g]=await Promise.all([get('/api/liga?id='+S.liga), get('/api/liga/games?id='+S.liga)]); }
    catch(e){ return status('err','No se pudo cargar la liga: '+esc(e.message)); }
    S.otra=d; S.games=g.games||[]; S.rounds=(g.rounds||[]).map(r=>({round:r,live:r===g.current&&g.live?g.live:0}));
    S.current=g.current;
    S.etapas=(g.copa&&g.etapas&&g.etapas.length)?g.etapas:null;
    S.llaves=g.llaves||null; S.grupoAbierto=null; S.cuadroDesde=null;
    S.fasesLiga=(g.fasesLiga&&g.fasesLiga.length)?g.fasesLiga:null;
    if(S.fasesLiga&&!S.fasesLiga.some(f=>f.num===S.fase)) S.fase=null;
    if(S.round==null||!g.rounds.includes(S.round))
      S.round=g.current??g.rounds[g.rounds.length-1]??null;
    $('.tag').textContent=`${d.nombre} · ${d.torneo}`;
    drawRounds();
    pintarFecha();
    // pestañas: una por zona, más promedios y goleadores
    // Las ligas de una sola tabla (LaLiga, la B Metro) no muestran Anual.
    // Y si la zona viene sin nombre —pasa cuando el torneo no tiene zonas—
    // la pestaña se llama "Tabla" y no "null".
    const nombreZona=(z,i)=>z && z.name ? z.name
      : (d.zonas.length>1 ? 'Zona '+(i+1) : 'Tabla');
    const hayCuadro=S.llaves&&S.llaves.some(b=>b.llaves.length);
    const tabs=[...d.zonas.map((z,i)=>['z'+i,nombreZona(z,i)]),
                ...(hayCuadro?[['cuadro','Cuadro']]:[]),
                ...(d.conAnual===false?[]:[['anual','Anual']]),
                ['gol','Goles']];
    // En una copa, si estás parado en una etapa eliminatoria lo que querés
    // ver al costado es el cuadro, no la tabla de grupos.
    const etapaActual=S.etapas&&S.etapas[S.round-1];
    if(hayCuadro&&etapaActual&&!/grupo/i.test(etapaActual)) S.tab='cuadro';
    if(!tabs.find(t=>t[0]===S.tab)) S.tab=tabs[0][0];
    $('#tabs').innerHTML=tabs.map(([id,nm])=>
      `<button data-t="${id}" class="${S.tab===id?'on':''}" onclick="App.tab('${id}')">${esc(nm)}</button>`).join('');
    drawOtra();
    status('ok',`<b>${esc(d.nombre)}</b> · ${esc(d.fuente||'365scores')}`);
    clearTimeout(S.timer);
    programarVivo();
  }

  /* ── el cuadro ───────────────────────────────────────────────────────
     Una columna de llaves por etapa, de la más lejana a la final. Cada
     llave muestra el global de la serie y marca al que pasó. Se clickea y
     abre el partido de vuelta, que es el que la define.                */
  /* Ordena cada ronda para que las dos llaves que alimentan un cruce queden
     una arriba de la otra. No hace falta saber el sorteo: alcanza con mirar
     quién sigue en carrera. Si Racing está en cuartos, la llave de octavos
     que tiene a Racing es una de las dos que llevan ahí. Se recorre de la
     final hacia atrás, que es de donde viene la información. */
  function ordenarCuadro(bloques){
    const nom=e=>sinTildes(e.team.canon||e.team.name);
    for(let c=bloques.length-2;c>=0;c--){
      const hijos=bloques[c+1].llaves, padres=bloques[c].llaves;
      if(!hijos.length||!padres.length) continue;
      const usado=new Set(), orden=[];
      hijos.forEach(h=>h.equipos.forEach(e=>{
        const n=nom(e);
        const i=padres.findIndex((p,idx)=>!usado.has(idx)&&p.equipos.some(x=>nom(x)===n));
        if(i>=0){ usado.add(i); orden.push(padres[i]); }
      }));
      padres.forEach((p,i)=>{ if(!usado.has(i)) orden.push(p); });
      bloques[c].llaves=orden;
    }
  }

  function cuadroLlaves(){
    // el cuadro arranca en la primera ronda eliminatoria que tenga datos:
    // en la Copa Argentina eso son los 32avos
    let bloques=(S.llaves||[]).map(b=>({etapa:b.etapa,llaves:b.llaves.slice()}));
    while(bloques.length&&!bloques[0].llaves.length) bloques.shift();
    if(!bloques.length)
      return '<div class="empty">El cuadro todavía no está definido.</div>';
    ordenarCuadro(bloques);

    /* Desde qué ronda se muestra. Arranca en la que se está jugando —los
       octavos se leen cómodos— y los botones ‹ › corren esa ventana. Cada
       paso hacia atrás duplica la cantidad de llaves, así que las cajas se
       achican: es el zoom out. */
    const aqui=S.etapas&&S.etapas[S.round-1];
    if(S.cuadroDesde==null){
      const i=bloques.findIndex(b=>b.etapa===aqui);
      S.cuadroDesde=i>=0?i:0;
    }
    S.cuadroDesde=Math.max(0,Math.min(bloques.length-1,S.cuadroDesde));
    S.cuadroTotal=bloques.length;
    const desde=S.cuadroDesde;
    const nombresRondas=bloques.map(b=>b.etapa);
    bloques=bloques.slice(desde);

    // en pantalla chica todo entra más justo
    const chico=window.innerWidth<=600;
    // cuántas llaves tiene la primera columna decide el tamaño: ocho entran
    // holgadas, dieciséis apretadas, treinta y dos sólo con el escudo
    const primerRotulo=bloques[0].etapa;
    const primeras=(function(){
      const t=[[/64avos|sesentaicuatro/i,64],[/32avos|treintaidos|treintaydos/i,32],
        [/16avos|dieciseis|diecis[eé]is/i,16],[/octavos|round of 16/i,8],
        [/cuartos|quarter/i,4],[/semi/i,2],[/final/i,1]];
      for(const [re,n] of t) if(re.test(primerRotulo||'')) return n;
      return Math.max(1,bloques[0].llaves.length);
    })();
    const nivel=Math.max(0,Math.min(2,Math.round(Math.log2(primeras/8))));
    const M=[{an:chico?134:150,alto:48,hueco:chico?10:12,sep:chico?26:34,corto:false},
             {an:chico?104:118,alto:38,hueco:8,sep:chico?20:26,corto:true},
             {an:chico?78:88, alto:30,hueco:6,sep:chico?16:20,corto:true}][nivel];
    const AN=M.an, ALTO=M.alto, HUECO=M.hueco, SEP=M.sep, TOPE=22;
    const paso=ALTO+HUECO;
    /* Cuántos cruces tiene cada ronda. La primera la manda el cuadro real
       —365scores numera cada llave con su lugar, así que si los octavos van
       del 1 al 8, son ocho aunque falte publicar alguno— y de ahí cada
       ronda tiene la mitad. */
    /* El tamaño de cada ronda lo dice su nombre, no los partidos que
       tengamos cargados: unos octavos son ocho llaves aunque falte publicar
       la mitad. Deducirlo de los datos rompía el cuadro —los 32avos con
       veinte partidos cargados daban veinte lugares y los cruces con los
       16avos dejaban de coincidir. */
    const TAMANO=[[/64avos|sesentaicuatro/i,64],[/32avos|treintaidos|treintaydos/i,32],
      [/16avos|dieciseis|diecis[eé]is/i,16],[/octavos|round of 16/i,8],
      [/cuartos|quarter/i,4],[/semi/i,2],[/final/i,1]];
    const porNombre=n=>{ for(const [re,t] of TAMANO) if(re.test(n||'')) return t; return 0; };
    const cupos=bloques.map(b=>porNombre(b.etapa));
    // lo que no se reconozca se completa mirando a los vecinos
    for(let c=bloques.length-2;c>=0;c--)
      if(!cupos[c]) cupos[c]=Math.max(1,(cupos[c+1]||1)*2);
    for(let c=1;c<bloques.length;c++)
      if(!cupos[c]) cupos[c]=Math.max(1,Math.ceil(cupos[c-1]/2));
    if(!cupos[0]) cupos[0]=Math.max(1,bloques[0].llaves.length);

    /* Los lugares de cada ronda. Si una serie ya se definió y el fixture de
       la ronda siguiente todavía no salió, igual se anota al que pasó: es lo
       primero que uno quiere ver cuando termina un partido. Esas cajas van
       sin resultado, porque el cruce todavía no se jugó. */
    const ganador=k=>k&&k.cerrada?(k.equipos.find(e=>e.pasa)||{}).team:null;
    const slots=bloques.map((b,c)=>{
      const fila=new Array(cupos[c]).fill(null);
      const sueltas=[];
      b.llaves.forEach(k=>{
        const s=(k.slot>=1&&k.slot<=cupos[c])?k.slot-1:-1;
        if(s>=0&&!fila[s]) fila[s]=k; else sueltas.push(k);
      });
      // las que no traen posición se acomodan en los huecos que quedaron
      sueltas.forEach(k=>{ const h=fila.indexOf(null); if(h>=0) fila[h]=k; });
      return fila;
    });
    for(let c=0;c<slots.length-1;c++){
      const unoAuno=cupos[c]===cupos[c+1];
      for(let j=0;j<slots[c+1].length;j++){
        if(slots[c+1][j]) continue;
        const g1=ganador(slots[c][unoAuno?j:2*j]),
              g2=unoAuno?null:ganador(slots[c][2*j+1]);
        if(!g1&&!g2) continue;
        slots[c+1][j]={provisional:true,cerrada:false,partidos:[],
          equipos:[{team:g1,goles:null,pasa:false},{team:g2,goles:null,pasa:false}]};
      }
    }
    /* Las alturas se calculan columna por columna en vez de con una
       fórmula. La mayoría de las rondas tiene la mitad de llaves que la
       anterior, pero no todas: el pre octavos de la Sudamericana tiene las
       mismas ocho que los octavos, porque los ocho ganadores se suman a los
       ocho que ya estaban clasificados. Ahí la línea va derecho, uno a uno. */
    const ys=[];
    for(let c=0;c<bloques.length;c++){
      if(c===0){ ys.push(Array.from({length:cupos[0]},(_,i)=>i*paso)); continue; }
      const prev=ys[c-1];
      if(cupos[c]===cupos[c-1]) ys.push(prev.slice());
      else ys.push(Array.from({length:cupos[c]},(_,i)=>{
        const a=prev[Math.min(2*i,prev.length-1)], b=prev[Math.min(2*i+1,prev.length-1)];
        return (a+b)/2;
      }));
    }
    const ancho=bloques.length*(AN+SEP)-SEP;
    const alto=Math.max(...ys.map(f=>f[f.length-1]))+ALTO;
    const x=c=>c*(AN+SEP);
    const y=(c,i)=>ys[c][i];
    const centro=(c,i)=>ys[c][i]+ALTO/2;

    let cajas='', lineas='';
    bloques.forEach((b,c)=>{
      cajas+=`<div class="brk-et" style="left:${x(c)}px;top:0">${esc(etapaCorta(b.etapa))}</div>`;
      for(let i=0;i<cupos[c];i++){
        const k=slots[c][i], top=y(c,i)+TOPE;
        // la altura de cada renglón sale de la caja: si no, al achicar el
        // cuadro los nombres quedaban cortados por la mitad
        const pos=`left:${x(c)}px;top:${top}px;width:${AN}px;height:${ALTO}px;`
          +`--fila:${(ALTO-2)/2}px;--fs:${nivel===2?9.5:nivel===1?10.5:11.5}px`;
        const porDefinir='<div class="eq"><span class="tn" style="color:var(--txt3)">Por definir</span></div>';
        if(!k){
          cajas+=`<div class="brk vacia" style="${pos}">${porDefinir}${porDefinir}</div>`;
        }else{
          const [a,v]=k.equipos;
          // apretado, el nombre completo no entra: va la sigla del club
          const rotulo=t=>M.corto?(t.short||t.canon||t.name):(t.canon||t.name);
          const lado=(e,otro)=>!e.team?porDefinir
            :`<div class="eq ${e.pasa?'pasa':(k.cerrada&&otro.pasa?'cae':'')}"
                title="${esc(e.team.canon||e.team.name)}">
              ${crest(e.team,M.corto?13:15)}<span class="tn">${esc(rotulo(e.team))}</span>
              <b>${e.goles==null?'–':e.goles}</b></div>`;
          if(k.provisional){
            cajas+=`<div class="brk vacia" title="Clasificado, cruce por jugarse"
              style="${pos}">${lado(a,v)}${lado(v,a)}</div>`;
          }else{
            const ultimo=k.partidos[k.partidos.length-1];
            const cuando=k.partidos.map(p=>(p.tramo||'')+(p.gh!=null?` ${p.gh}-${p.ga}`:'')).join(' · ');
            cajas+=`<div class="brk" title="${esc(cuando)}" onclick="App.openMatch('${js(ultimo.id)}')"
              style="${pos}">${lado(a,v)}${lado(v,a)}</div>`;
          }
        }
        // la línea hacia el cruce siguiente: sale, dobla y entra
        if(c<bloques.length-1){
          const destino=(cupos[c]===cupos[c+1])?i:Math.floor(i/2);
          if(destino<cupos[c+1]){
            const yi=centro(c,i)+TOPE, yh=centro(c+1,destino)+TOPE;
            const xm=x(c)+AN+SEP/2;
            lineas+=`<path d="M${x(c)+AN} ${yi}H${xm}V${yh}H${x(c+1)}" fill="none"
              stroke="var(--line)" stroke-width="1.5"/>`;
          }
        }
      }
    });

    const hayAtras=desde>0, hayAdelante=desde<nombresRondas.length-1;
    return `<div class="cuadro-barra">
        <button class="cbtn" onclick="App.correrCuadro(-1)" ${hayAtras?'':'disabled'}
          title="Ronda anterior (se ve más chico)">‹</button>
        <span class="cbtn-lb">${esc(etapaCorta(nombresRondas[desde]))}
          ${nivel?`<i class="lupa">− ${nivel+1}×</i>`:''}</span>
        <button class="cbtn" onclick="App.correrCuadro(1)" ${hayAdelante?'':'disabled'}
          title="Ronda siguiente">›</button>
      </div>
      <div class="cuadro-wrap" id="cuadroWrap"><div class="cuadro"
      style="width:${ancho}px;height:${alto+TOPE}px">
      <svg class="cuadro-lineas" width="${ancho}" height="${alto+TOPE}">${lineas}</svg>
      ${cajas}</div></div>`;
  }

  // Los diez primeros goleadores, para poner abajo del cuadro sin que ocupe
  // media pantalla. El título va siempre: si no hay datos, se dice, en vez
  // de dejar el espacio en blanco y que parezca que falta algo.
  function golesCorto(rows,error){
    if(!rows.length) return `<div style="padding:0 14px 14px">
      <div class="cuadro-et">Goleadores</div>
      <div style="font-size:12px;color:var(--txt2)">
        Todavía no hay tabla de goleadores para este torneo.
        ${error?`<br><span style="font-size:10.5px;color:var(--txt3)">${esc(error)}</span>`:''}
      </div></div>`;
    return `<div style="padding:0 14px 12px">
      <div class="cuadro-et">Goleadores</div>
      ${rows.slice(0,10).map((r,i)=>`<div style="display:flex;align-items:center;gap:8px;
          padding:5px 0;border-bottom:1px solid var(--line);cursor:pointer;font-size:12.5px"
          onclick="App.player('${js(r.name)}','${js(r.team.name)}')">
        <span style="color:var(--txt3);width:14px;font-size:11px">${i+1}</span>
        ${crest(r.team,18)}
        <span style="flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">
          ${esc(r.name)}</span>
        <b style="font-weight:800">${r.goals}</b></div>`).join('')}</div>`;
  }

  function drawOtra(){
    const d=S.otra, el=$('#right'); if(!d) return;
    // Franja de color al costado de la posición. Faltaban las tres de Europa
    // y por eso LaLiga no marcaba nada.
    const DEST={final:'z-camp',reducido:'z-lib',
                champions:'z-lib',europa:'z-camp',conference:'z-sud',
                avanza:'z-lib',repechaje:'z-camp',
                desciende:'z-desc'};
    const tabla=(rows,cols)=>`<div class="tablewrap"><table><thead><tr>
      <th style="width:26px"></th><th class="l">Equipo</th>${cols.map(c=>`<th>${c[0]}</th>`).join('')}
      </tr></thead><tbody>${rows.map((r,i)=>{
      const zc=DEST[r.destino];
      return `<tr${r.destinoTexto?` title="${esc(r.destinoTexto)}"`:''}>
       <td class="pos">${zc?`<span class="zone ${zc}"></span>`:''}${r.pos??i+1}</td>
       <td class="l"><div class="tcell">${crest(r.team,18)}<span class="tn">${esc(r.team.name)}</span>${r.live?'<span class="live-tag" title="Jugando ahora"></span>':''}</div></td>
       ${cols.map(c=>`<td${c[2]?' class="pts"':''}>${c[1](r)}</td>`).join('')}</tr>`;}).join('')}
      </tbody></table></div>`;
    const leyenda=()=>d.leyenda&&S.tab.startsWith('z')
      ? `<div class="leg">${d.leyenda.map(x=>`<span><i style="background:${esc(x.color)}"></i>${esc(x.texto)}</span>`).join('')}</div>`
      : '';
    if(S.tab.startsWith('z')){
      const z=d.zonas[+S.tab.slice(1)];
      el.innerHTML=z
        ? tabla(z.rows,[['Pts',r=>r.pts,1],['PJ',r=>r.pj],['GF',r=>r.gf],['GC',r=>r.gc],
                        ['DIF',r=>(r.dif>0?'+':'')+r.dif]]) + leyenda()
        : '<div class="empty">Sin datos.</div>';
    } else if(S.tab==='cuadro'){
      el.innerHTML=cuadroLlaves()+golesCorto(d.goleadores||[],d.errorGoleadores);
    } else if(S.tab==='anual'){
      el.innerHTML=d.anual.length
        ? tabla(d.anual,[['Pts',r=>r.pts,1],['PJ',r=>r.pj],
                         ['GF',r=>r.gf],['GC',r=>r.gc],['DIF',r=>(r.dif>0?'+':'')+r.dif],
                         ['Zona',r=>esc((r.zona||'').replace('Zona ',''))]])
          + (d.anualNota?`<div class="note">${esc(d.anualNota)}</div>`:'')
        : '<div class="empty">Sin tabla general.</div>';
    } else {
      el.innerHTML=d.goleadores.length?`<div class="tablewrap"><table><thead><tr>
        <th style="width:26px"></th><th class="l">Jugador</th><th>Goles</th>
        <th>Jug</th><th>Cab</th><th>TL</th><th>Pen</th></tr></thead><tbody>${
        d.goleadores.slice(0,30).map(r=>`<tr style="cursor:pointer" onclick="App.player('${js(r.name)}','${js(r.team.name)}')">
          <td class="pos">${r.rank}</td>
          <td class="l"><div class="tcell">${crest(r.team,18)}<span class="tn"><b style="font-weight:600">${esc(r.name)}</b>
            <span style="color:var(--txt2);font-size:11px;display:block;line-height:1.1">${esc(r.team.name)}</span>
          </span></div></td><td class="pts">${r.goals}</td>
          <td style="color:var(--txt2)">${r.jugada??0}</td><td style="color:var(--txt2)">${r.cabeza??0}</td>
          <td style="color:var(--txt2)">${r.tiroLibre??0}</td><td style="color:var(--txt2)">${r.pens??0}</td>
        </tr>`).join('')}</tbody></table></div>
        <div class="note">Fuente: <b>AFA / DataFactory</b>.</div>`
        :'<div class="empty">Sin goleadores.</div>';
    }
  }

  async function loadAll(first){
    if(S.liga==='home') return loadHome();
    if(S.liga!=='lpf') return loadOtra();
    try{
      const rd=await get('/api/rounds');
      S.rounds=rd.rounds; S.current=rd.current;
      if(S.round==null) S.round=rd.current;
      S.failures=0;
      shell();
      drawSide();
      drawRounds();
      await loadRound();
      // tablas en paralelo
      const [st,an,pr,sc]=await Promise.all([
        get('/api/standings').catch(()=>null),
        get('/api/annual').catch(()=>null),
        get('/api/promedios').catch(()=>null),
        S.scorers?Promise.resolve(S.scorers):get('/api/scorers').catch(()=>null)
      ]);
      S.standings=st||S.standings; S.annual=an||S.annual;
      S.promedios=pr||S.promedios; S.scorers=sc||S.scorers;
      drawRight();

      const live=S.games.filter(m=>m.status==='LIVE').length;
      const tot=rd.total_partidos||0;
      if(live) status('live',`<b>${live} partido${live>1?'s':''} en vivo</b> · tablas moviéndose`);
      else status('ok',`<b>Tablas oficiales de AFA</b> · partidos de 365scores · ${tot} del Clausura cargados`);
      // avisos que explican por qué algo podría no cerrar
      programarVivo();
      if(st&&st.nota) status('err',`<b>Atención:</b> ${esc(st.nota)}`);
      else if(rd.incompletas&&rd.incompletas.length)
        status('err',`<b>Ojo:</b> falta${rd.incompletas.length>1?'n':''} partido${rd.incompletas.length>1?'s':''} en la fecha ${rd.incompletas.join(', ')}`);
      schedule(live>0);
    }catch(e){
      S.failures++;
      if(first||S.failures>3) offline(e.message);
      else status('err','Sin conexión con el servidor — reintentando…');
      schedule(false);
    }
  }

  async function loadRound(){
    const r=await get('/api/games?round='+S.round);
    S.games=r.games;
    drawMatches();
  }

  function schedule(fast){
    clearTimeout(S.timer);
    if(!AUTO_REFRESCO) return;
    S.timer=setTimeout(()=>loadAll(false), (fast?CADA_EN_VIVO:CADA_NORMAL)*1000);
  }

  /* ── Actualización en vivo, sin redibujar ───────────────────────────── */

  // ¿Vale la pena consultar? Sólo si hay algo en juego o cerca de empezar.
  function hayQueMirar(){
    const ahora=Date.now(), margen=VIVO_MARGEN*3600*1000;
    return S.games.some(m=>m.status==='LIVE' ||
      (m.status==='PROG' && m.start && Math.abs(new Date(m.start)-ahora)<margen));
  }

  // Reemplaza un pedazo sólo si de verdad cambió, para no tocar el DOM al pedo
  function reemplazar(viejo,html){
    if(!viejo || viejo.outerHTML===html) return false;
    const tmp=document.createElement('div');
    tmp.innerHTML=html;
    viejo.replaceWith(tmp.firstElementChild);
    return true;
  }

  function actualizarFila(fila,m){
    const cont=fila.querySelector('.m-fila')||fila;
    const partes=cont.children;   // [tiempo, local, marcador, visitante]
    const antes=(partes[2]||{}).textContent;
    let toco=false;
    toco=reemplazar(partes[0],htmlTiempo(m))||toco;
    toco=reemplazar(partes[2],htmlMarcador(m))||toco;
    // el negrita del que va ganando
    const c1=claseLado(m,true), c2=claseLado(m,false);
    if(partes[1]&&partes[1].className!==c1){ partes[1].className=c1; toco=true; }
    if(partes[3]&&partes[3].className!==c2){ partes[3].className=c2; toco=true; }

    const ahora=(cont.children[2]||{}).textContent;
    const gol = antes && ahora && antes!==ahora && ahora!=='vs';
    if(gol){                       // relanzar el destello verde
      fila.classList.remove('flash');
      void fila.offsetWidth;
      fila.classList.add('flash');
    }
    return {toco, gol};
  }

  async function tickVivo(){
    clearTimeout(S.vivoTimer); S.vivoTimer=null;
    if(!VIVO_ACTIVO || document.hidden) return programarVivo();
    if(!hayQueMirar()) return programarVivo();

    let datos;
    try{
      if(S.liga==='home')
        datos=(await get('/api/home?date='+ymd(S.homeDate))).bloques.flatMap(b=>b.games);
      else if(S.liga==='lpf')
        datos=(await get('/api/games?round='+S.round)).games;
      else
        datos=(await get('/api/liga/games?id='+S.liga+'&round='+S.round)).games;
    }catch(e){ return programarVivo(); }

    let goles=0, vivos=0;
    datos.forEach(m=>{
      if(m.status==='LIVE') vivos++;
      const i=S.games.findIndex(x=>String(x.id)===String(m.id));
      if(i>=0) S.games[i]=Object.assign(S.games[i],m);
      const fila=document.querySelector('.match[data-id="'+String(m.id).replace(/"/g,'\\"')+'"]');
      if(!fila) return;
      S.scores[m.id]=`${m.gh}-${m.ga}`;
      if(actualizarFila(fila,m).gol) goles++;
    });

    const cnt=$('#liveCnt');
    if(cnt) cnt.textContent=vivos;
    const btn=$('#liveBtn');
    if(btn) btn.classList.toggle('on',vivos>0);

    // Si hay un partido abierto y se está jugando, se vuelve a pedir el
    // detalle: es lo que hace que las formaciones pasen de plantel entero a
    // once confirmado, y que los goles y cambios aparezcan sin cerrar nada.
    if(mBase && $('#ov').classList.contains('show') && mBase.liveId){
      const act=datos.find(x=>String(x.id)===String(mBase.id));
      if(act) mBase=Object.assign(mBase,act);
      if(mBase.status==='LIVE'||mBase.status==='PROG'){
        try{ mData=await get('/api/match?id='+mBase.liveId); drawModal(current(),false); }
        catch(e){}
      }
    }

    // Las tablas sólo se rehacen cuando hubo un gol: es cuando de verdad
    // cambian. Están en el panel de al lado, así que no molesta.
    if(goles && S.liga!=='home'){
      try{ S.liga==='lpf' ? await renderRight() : await refrescarTablas(); }catch(e){}
    }
    programarVivo();
  }

  function programarVivo(){
    clearTimeout(S.vivoTimer);
    if(VIVO_ACTIVO) S.vivoTimer=setTimeout(tickVivo, VIVO_CADA*1000);
  }

  async function refrescarTablas(){
    try{ S.otra=await get('/api/liga?id='+S.liga); drawOtra(); }catch(e){}
  }

  // Lo mismo para la Liga Profesional. Estaba llamada desde dos lugares pero
  // nunca escrita: como iba dentro de un try, el error se comía solo y las
  // tablas de Primera no se movían después de un gol.
  async function renderRight(){
    const [st,an,pr,sc]=await Promise.all([
      get('/api/standings').catch(()=>null),
      get('/api/annual').catch(()=>null),
      get('/api/promedios').catch(()=>null),
      get('/api/scorers').catch(()=>null)
    ]);
    S.standings=st||S.standings; S.annual=an||S.annual;
    S.promedios=pr||S.promedios; S.scorers=sc||S.scorers;
    drawRight();
  }

  /* ─────────────────────────────────────────────────────────────────────
     Medición de visitas (Google Analytics 4)
     ─────────────────────────────────────────────────────────────────────
     Pegá tu identificador acá abajo y listo. Se saca de
     analytics.google.com → Administrar → Flujos de datos → Web, y tiene
     la forma G-XXXXXXXXXX.

     Mientras esté vacío no se carga nada de Google: ni scripts, ni
     cookies, ni pedidos. La página funciona igual.

     HAYVAR es una sola página: el navegador nunca cambia de dirección, así
     que Analytics contaría una sola visita y nunca sabrías qué miraron.
     Por eso cada sección avisa por su cuenta cuál se abrió.               */

  const GA_ID = '';   // ej: 'G-ABC1234XYZ'

  const medir = (function(){
    // nombre de cada sección tal como va a aparecer en los informes
    const RUTA={home:'/portada', lpf:'/liga-profesional',
                nacional:'/primera-nacional', pbm:'/primera-b-metro',
                fa:'/federal-a', fem:'/futbol-femenino', laliga:'/laliga'};
    const TITULO={home:'Portada', lpf:'Liga Profesional',
                  nacional:'Primera Nacional', pbm:'Primera B Metro',
                  fa:'Federal A', fem:'Fútbol femenino', laliga:'LaLiga'};
    let listo=false, ultima=null;

    function arrancar(){
      if(!GA_ID||listo) return;
      listo=true;
      window.dataLayer=window.dataLayer||[];
      window.gtag=function(){window.dataLayer.push(arguments);};
      gtag('js', new Date());
      // el page_view automático se apaga: lo manda seccion() con la ruta
      // que corresponde, si no todo quedaría bajo "/"
      gtag('config', GA_ID, {send_page_view:false});
      const s=document.createElement('script');
      s.async=true;
      s.src='https://www.googletagmanager.com/gtag/js?id='+encodeURIComponent(GA_ID);
      document.head.appendChild(s);
      seccion(S.liga);
    }

    // una "visita a página" por cada torneo que se abre
    function seccion(id){
      if(!listo||!window.gtag) return;
      const ruta=RUTA[id]||('/'+id);
      if(ruta===ultima) return;
      ultima=ruta;
      gtag('event','page_view',{
        page_title:TITULO[id]||id,
        page_location:location.origin+ruta,
        page_path:ruta
      });
    }

    // cualquier otra cosa que valga la pena saber
    function evento(nombre,datos){
      if(!listo||!window.gtag) return;
      try{ gtag('event',nombre,datos||{}); }catch(e){}
    }

    return {arrancar, seccion, evento};
  })();

  const api={
    init(){
      document.documentElement.dataset.theme=localStorage.getItem('hayvar.theme')||'light';
      medir.arrancar();
      loadAll(true);
      cargarEmblemas();
      // el club elegido se recuerda entre sesiones
      try{ const c=localStorage.getItem('hayvar.club'); if(c) setTimeout(()=>aplicarClub(JSON.parse(c)),50); }catch(e){}
    },
    liga(id){
      if(id===S.liga) return;
      medir.seccion(id);
      S.liga=id; S.round=null; S.tab=id==='lpf'?'A':'z0'; S.otra=null; S.scores={};
      S.etapas=null;   // si venías de una copa, los rótulos eran etapas
      clearTimeout(S.timer); clearTimeout(S.vivoTimer); drawSide(); api.menu(false);
      if(id==='lpf'){
        $('.tag').textContent='Liga Profesional · Clausura 2026';
        $('#tabs').innerHTML=[['A','Zona A'],['B','Zona B'],['anual','Anual'],['prom','Promedios'],['gol','Goles']]
          .map(([k,n],i)=>`<button data-t="${k}" class="${i===0?'on':''}" onclick="App.tab('${k}')">${n}</button>`).join('');
      }
      loadAll(false);
    },
    homeDay(s){ S.homeDate=s?new Date(s+'T12:00:00'):new Date();
      if(!s){ const w=new Date(S.homeDate); w.setDate(w.getDate()-((w.getDay()+6)%7)); S.weekStart=w; }
      drawCal(); loadHome(); },
    homeWeek(n){ S.weekStart=addDays(S.weekStart,n*7); S.homeDate=new Date(S.weekStart); drawCal(); loadHome(); },
    clubPicker,
    menu(abrir){
      const a=$('#side'), sc=$('#scrim'); if(!a) return;
      const v=abrir===undefined?!a.classList.contains('open'):abrir;
      a.classList.toggle('open',v); sc.classList.toggle('show',v);
      document.body.style.overflow=v?'hidden':'';
    },
    // al cambiar de club se rehace lo que está en pantalla: la portada para
    // traer el último y el próximo, y las tablas para pintar la fila
    // plegar y desplegar un grupo en la fase de grupos de las copas
    grupo(z){ S.grupoAbierto=(S.grupoAbierto===z)?'__ninguno__':z; pintarFecha(); },
    // cambiar de fase en los torneos que la tienen (Federal A)
    fase(n){ S.fase=n; S.round=null; drawRounds(); pintarFecha(); },
    // correr el cuadro una ronda: hacia atrás entra el doble de llaves, así
    // que se redibuja más chico
    correrCuadro(d){
      if(S.cuadroDesde==null) return;
      S.cuadroDesde=Math.max(0,Math.min((S.cuadroTotal||1)-1,S.cuadroDesde+d));
      drawOtra();
    },
    setClub(c){ aplicarClub(c); api.closeModal();
      medir.evento('modo_club',{club:c?c.name:'(ninguno)'});
      if(S.liga==='home') loadHome(); else if(S.liga==='lpf') drawRight(); },
    pick(r){ S.round=r; drawRounds();
      medir.evento('cambiar_fecha',{liga:S.liga, fecha:String(r)});
      if(S.liga!=='lpf'){ pintarFecha(); return; }
      loadRound().then(()=>{ const live=S.games.filter(m=>m.status==='LIVE').length; schedule(live>0); }); },
    player: openPlayer,
    jugador(nombre,atletaId){ openPlayer(nombre,'',atletaId); },
    tab(t){ S.tab=t; document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
      S.liga==='lpf'?drawRight():drawOtra(); },
    onlyLive(){ S.onlyLive=!S.onlyLive; drawMatches(); },
    mtab(t){ mTab=t; drawModal(current(),false); },
    openMatch, closeModal(){ $('#ov').classList.remove('show'); document.body.style.overflow=''; },
    reload(){ clearTimeout(S.timer); loadAll(false); },
    theme(){ const t=document.documentElement.dataset.theme==='dark'?'light':'dark';
      document.documentElement.dataset.theme=t; try{localStorage.setItem('hayvar.theme',t);}catch(e){} }
  };
  document.addEventListener('keydown',e=>{if(e.key==='Escape')api.closeModal();});
  // volver a la pestaña actualiza sólo si el refresco automático está activado
  document.addEventListener('visibilitychange',()=>{
    if(document.hidden) return;
    if(AUTO_REFRESCO) api.reload(); else tickVivo();
  });
  return api;
})();

App.init();
</script>
</body>
