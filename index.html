<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HAYVAR — Liga Profesional Argentina</title>

     nítido en cualquier pantalla— pero varios navegadores siguen pidiendo

<meta name="theme-color" content="#141b34">

<style>
:root{
  --nav:#141b34; --nav2:#1c2547; --nav3:#26315c;
  --bg:#eceef2; --card:#fff; --line:#e2e5ec;
  --txt:#1a1f2e; --txt2:#6b7285; --txt3:#9aa1b3;
  --acc:#2f6fed; --live:#12b76a; --gold:#f0b429; --red:#e5484d;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
}
html[data-theme="dark"]{
  --nav:#0d1226; --nav2:#151c36; --nav3:#212b50;
  --bg:#0a0e1c; --card:#141a2e; --line:#232b45;
  --txt:#e8ebf2; --txt2:#98a1b8; --txt3:#6c748c;
  --shadow:0 1px 3px rgba(0,0,0,.4);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
  background:var(--bg);color:var(--txt);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--txt3);border-radius:6px}

header{background:var(--nav);color:#fff;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.hwrap{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:0 16px;height:56px}
.logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:20px;letter-spacing:-.5px}
/* el gesto del árbitro: la pantalla dibujada en el aire */
.logo .ball{width:30px;height:30px;border-radius:7px;background:#ff3b30;color:#fff;display:grid;place-items:center}
.logo .ball svg{width:19px;height:19px;display:block}
.logo .m{color:#ff3b30}   /* el VAR en rojo */
.tag{font-size:11px;font-weight:600;background:rgba(255,255,255,.12);padding:3px 9px;border-radius:11px;letter-spacing:.3px}
.clubcrest{width:26px;height:26px;align-items:center;justify-content:center;flex:none;margin-left:-4px}
.clubcrest img{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;display:block}
.beta{font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:1px;
  background:#ff3b30;color:#fff;padding:2px 6px;border-radius:4px;align-self:center}
.hsearch{position:relative;flex:1;max-width:280px}
.hsearch input{width:100%;height:32px;border-radius:16px;border:1px solid rgba(255,255,255,.16);
  background:rgba(255,255,255,.08);color:#fff;padding:0 12px 0 30px;font-size:13px;outline:none;font-family:inherit}
.hsearch input::placeholder{color:rgba(255,255,255,.45)}
.hsearch input:disabled{cursor:not-allowed}
.hsearch .ic{position:absolute;left:11px;top:6px;font-size:15px;color:rgba(255,255,255,.5)}
.hspacer{flex:1}

/* ── portada ── */
.calbar{background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);
  margin-bottom:14px;overflow:hidden}
.calhead{display:flex;align-items:center;justify-content:space-between;padding:9px 12px;border-bottom:1px solid var(--line)}
.calhead .mth{font-weight:700;font-size:14px;text-transform:capitalize}
.calhead .navs{display:flex;gap:4px}
.calhead .navs button{width:28px;height:28px;border-radius:7px;background:var(--bg);font-size:14px;color:var(--txt2)}
.calhead .navs button:hover{background:var(--acc);color:#fff}
.days{display:grid;grid-template-columns:repeat(7,1fr)}
.day{padding:7px 2px;text-align:center;cursor:pointer;border-right:1px solid var(--line)}
.day:last-child{border-right:0}
.day:hover{background:var(--bg)}
.day .dw{font-size:10px;text-transform:uppercase;color:var(--txt3);font-weight:700;letter-spacing:.5px}
.day .dn{font-size:17px;font-weight:700;margin-top:1px}
.day.today .dn{color:var(--acc)}
.day.sel{background:var(--nav);color:#fff}
.day.sel .dw{color:rgba(255,255,255,.6)}
.day.sel .dn{color:#fff}
.lgrow{display:flex;align-items:center;gap:9px;padding:9px 14px;background:var(--bg);
  border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.lgrow .badge{min-width:26px;height:20px;padding:0 5px;border-radius:4px;background:var(--nav);color:#fff;
  display:grid;place-items:center;font-size:9px;font-weight:800;letter-spacing:.3px}
.lgrow .nm{font-size:12.5px;font-weight:700;flex:1}
.lgrow .go{font-size:11px;color:var(--acc);font-weight:600;cursor:pointer}

/* selector de club */
.clubgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:8px}
.clubgrid button{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;
  border:1px solid var(--line);background:var(--card);font-size:12.5px;text-align:left;font-weight:600}
.clubgrid button:hover{border-color:var(--acc)}
.clubgrid .sw{width:22px;height:22px;border-radius:0;flex:none;object-fit:contain}
.clubgrid .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.clubgrid button{min-width:0}
.hbtn{height:32px;padding:0 12px;border-radius:16px;font-size:12.5px;font-weight:600;background:rgba(255,255,255,.1);display:flex;align-items:center;gap:6px}
.hbtn:hover{background:rgba(255,255,255,.2)}
.hbtn.on{background:var(--live)}

#bar{background:var(--nav2);color:#c9d2e8;font-size:12px;border-top:1px solid rgba(255,255,255,.07)}
#bar .in{max-width:1240px;margin:0 auto;padding:6px 16px;display:flex;align-items:center;gap:9px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--txt3);flex:none}
.dot.ok{background:var(--live)}
.dot.err{background:var(--red)}
.dot.live{background:var(--live);animation:beat 1.4s infinite}
@keyframes beat{0%,100%{box-shadow:0 0 0 0 rgba(18,183,106,.6)}70%{box-shadow:0 0 0 6px rgba(18,183,106,0)}}
#bar b{color:#fff}

.shell{max-width:1380px;margin:14px auto;padding:0 16px;display:grid;
  grid-template-columns:186px minmax(0,1fr) 372px;gap:14px;align-items:start}
.card{background:var(--card);border-radius:10px;box-shadow:var(--shadow);border:1px solid var(--line);overflow:hidden;margin-bottom:14px}

/* ── barra lateral de ligas ── */
aside{background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);
  overflow:hidden;position:sticky;top:84px}
aside h4{font-size:10px;text-transform:uppercase;letter-spacing:.7px;color:var(--txt3);
  padding:11px 12px 5px;font-weight:700}
aside a{display:flex;align-items:center;gap:8px;padding:8px 12px;font-size:13px;color:var(--txt);
  border-left:3px solid transparent;cursor:pointer;white-space:nowrap}
aside a .nm{overflow:hidden;text-overflow:ellipsis;min-width:0}
aside a.off{padding-left:15px}
aside a:hover{background:var(--bg)}
aside a.on{background:var(--bg);border-left-color:#ff3b30;font-weight:700}
aside a.off{color:var(--txt3);cursor:default}
aside a.off:hover{background:transparent}
aside .pill{margin-left:auto;flex:none;font-size:9px;text-transform:uppercase;letter-spacing:.4px;
  background:var(--line);color:var(--txt2);padding:1px 5px;border-radius:8px}
aside .sep{height:1px;background:var(--line);margin:6px 0}
.lgimg{width:18px;height:18px;flex:none;object-fit:contain;display:inline-flex;
  align-items:center;justify-content:center;font-size:12px;color:var(--txt3)}
/* separador entre los dos tiempos */
.ht{display:flex;align-items:center;gap:9px;margin:10px 0;color:var(--txt3);
  font-size:10px;text-transform:uppercase;letter-spacing:.7px;font-weight:700}
.ht::before,.ht::after{content:"";flex:1;height:1px;background:var(--line)}

/* la tabla scrollea sola, sin arrastrar las pestañas */
.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.tablewrap table{min-width:100%}

.rounds{display:flex;align-items:center;gap:6px;padding:9px 12px;overflow-x:auto}
.rounds .lb{font-size:11px;font-weight:700;text-transform:uppercase;color:var(--txt2);letter-spacing:.5px;flex:none;margin-right:3px}
.rounds button{flex:none;min-width:32px;height:30px;padding:0 9px;border-radius:7px;background:var(--bg);
  font-size:13px;font-weight:700;color:var(--txt2);border:1px solid transparent}
.rounds button:hover{border-color:var(--acc);color:var(--acc)}
.rounds button.on{background:var(--nav);color:#fff}
.rounds button.playing{box-shadow:inset 0 -3px 0 var(--live)}
/* la fecha en curso, aunque no haya nada jugándose ahora */
.rounds button.actual{position:relative}
.rounds button.actual::after{content:"";position:absolute;left:50%;bottom:3px;transform:translateX(-50%);
  width:4px;height:4px;border-radius:50%;background:var(--acc)}
.rounds button.actual.on::after{background:#fff}
.rounds button.playing::after{display:none}

.tabs{display:flex;gap:2px;padding:0 8px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{padding:10px 12px;font-size:12px;font-weight:700;color:var(--txt2);border-bottom:3px solid transparent;
  text-transform:uppercase;letter-spacing:.3px;white-space:nowrap}
.tabs button.on{color:var(--acc);border-bottom-color:var(--acc)}
.tabs .cnt{display:inline-block;background:var(--live);color:#fff;border-radius:9px;padding:0 6px;font-size:10px;margin-left:5px}

.zhead{display:flex;align-items:center;gap:9px;padding:9px 14px;background:var(--bg);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.zhead .badge{min-width:22px;height:22px;padding:0 5px;border-radius:5px;background:var(--nav);
  color:#fff;display:grid;place-items:center;font-size:11px;font-weight:800;flex:none;
  white-space:nowrap;overflow:hidden}
.zhead .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.zhead .nm{font-size:12.5px;font-weight:700;flex:1}
.zhead .rd{font-size:11px;color:var(--txt2)}
.zhead.plegable{cursor:pointer}
.zhead.plegable:hover{background:var(--line)}
.zhead .flecha{color:var(--txt2);font-size:11px;flex:none}

/* ── cuadro de llaves de las copas ──────────────────────────────────────
   Las columnas van de la ronda que estás mirando hasta la final, y se
   corren de costado porque a lo ancho no entran. Las líneas se dibujan en
   un SVG por encima, que es lo único que une bien dos cajas a distinta
   altura sin pelearse con el scroll.                                    */
.cuadro-barra{display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:9px 14px 0}
.cuadro-barra .cbtn{width:28px;height:28px;border-radius:7px;background:var(--bg);
  color:var(--txt2);font-size:15px;font-weight:700;flex:none}
.cuadro-barra .cbtn:hover{background:var(--line);color:var(--txt)}
.cuadro-barra .cbtn[disabled]{opacity:.3;cursor:default}
.cuadro-barra .cbtn-lb{flex:1;text-align:center;font-size:11px;font-weight:700;
  text-transform:uppercase;letter-spacing:.6px;color:var(--txt2)}
.cuadro-barra .lupa{font-style:normal;font-size:9.5px;color:var(--txt3);margin-left:4px}
.cuadro-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;padding:12px 14px;
  scroll-behavior:smooth}
.cuadro{position:relative}
.cuadro-lineas{position:absolute;inset:0;pointer-events:none;overflow:visible}
.brk{position:absolute;border:1px solid var(--line);border-radius:7px;overflow:hidden;
  background:var(--card);cursor:pointer;transition:border-color .12s}
.brk:hover{border-color:var(--acc)}
.brk.vacia{background:var(--bg);border-style:dashed;cursor:default}
.brk{--fila:23px;--fs:11.5px}
.brk .eq{display:flex;align-items:center;gap:6px;padding:0 7px;
  height:var(--fila);font-size:var(--fs)}
.brk .eq+.eq{border-top:1px solid var(--line)}
.brk .eq .tn{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brk .eq b{font-weight:800;font-variant-numeric:tabular-nums;font-size:var(--fs)}
.brk .eq.pasa{background:rgba(47,111,237,.10)}
.brk .eq.pasa .tn{font-weight:700}
.brk .eq.cae .tn,.brk .eq.cae b{color:var(--txt3)}
.brk .eq .crest{width:15px;height:15px;flex:none}
.brk-et{position:absolute;font-size:10px;text-transform:uppercase;letter-spacing:.5px;
  color:var(--txt2);font-weight:700;white-space:nowrap}
.cuadro-et{font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--txt2);
  font-weight:700;margin:12px 0 6px}
.cuadro-et:first-child{margin-top:0}

.match{padding:9px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.m-fila{display:grid;grid-template-columns:56px 1fr 50px 1fr;align-items:center;gap:8px}
.m-extra:empty{display:none}
/* los goles quedan bajo el nombre de cada equipo: los del local arrancan
   donde arranca su nombre y los del visitante terminan donde termina el suyo */
.m-goles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:4px 64px 0 64px;
  font-size:11px;color:var(--txt2);line-height:1.55}
.m-goles>span{min-width:0}
.m-goles>span:last-child{text-align:right}
/* La tanda va justo abajo del marcador, no en el medio de la fila: se repite
   la misma grilla del partido y se la mete en la columna del resultado. */
.m-pen{display:grid;grid-template-columns:56px 1fr 50px 1fr;gap:8px;margin:3px 0 0}
.m-pen b{grid-column:3;text-align:center;white-space:nowrap;font-size:10.5px;
  font-weight:700;color:var(--txt2);letter-spacing:.3px}
/* y en el detalle del partido, su propio bloque al pie del minuto a minuto */
.pen-bloque{margin-top:14px;padding-top:11px;border-top:1px solid var(--line)}
.pen-tit{display:flex;align-items:center;justify-content:space-between;
  font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;
  color:var(--txt2);font-weight:700;margin-bottom:8px}
.pen-tit b{font-size:14px;color:var(--txt);font-variant-numeric:tabular-nums}
.pen-cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pen-cols>div:last-child{text-align:right}
.pen-pat{display:flex;align-items:center;gap:6px;font-size:12px;padding:2px 0}
.pen-cols>div:last-child .pen-pat{flex-direction:row-reverse}
.pen-pat .tic{font-weight:800;flex:none;width:13px;text-align:center}
.pen-pat.ok .tic{color:var(--live)}
.pen-pat.no .tic{color:var(--red)}
.pen-pat.no .nm{color:var(--txt3);text-decoration:line-through}
.pen-vacio{color:var(--txt3);font-size:12px}
/* Un gol por renglón. Puestos al costado con puntitos, los partidos con
   muchos goles se cortaban en cualquier lado y no se sabía cuál era de
   quién. Así cada uno se lee solo, y del lado de su equipo. */
.m-goles .gol{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* gol anulado por el VAR: se ve, pero se nota que no contó */
.gol-anulado{text-decoration:line-through;text-decoration-thickness:1px;
  color:var(--txt3);opacity:.85}
.gol-anulado::after{content:"VAR";font-size:8px;font-weight:800;letter-spacing:.3px;
  color:var(--red);text-decoration:none;display:inline-block;vertical-align:1px;
  margin-left:3px}
.m-goles span:last-child{text-align:right;padding-right:56px}
.m-tv{margin:3px 0 0 64px;font-size:10px;color:var(--txt3);text-transform:uppercase;letter-spacing:.4px}
.m-tv::before{content:"▶ ";font-size:8px;vertical-align:1px}
.match:hover{background:var(--bg)}
.match:last-child{border-bottom:0}
.match.flash{animation:flash 1.6s ease-out}
@keyframes flash{0%{background:rgba(18,183,106,.28)}100%{background:transparent}}
.m-time{font-size:12px;color:var(--txt2);text-align:center;font-weight:600;line-height:1.2}
.m-time .st{display:block;font-size:9.5px;text-transform:uppercase;letter-spacing:.4px}
.m-time.live{color:var(--live)}
.m-time.live .mm{font-weight:800;font-size:13.5px}
.m-time.fin{color:var(--txt3)}
.side{display:flex;align-items:center;gap:8px;min-width:0}
.side.away{flex-direction:row-reverse;text-align:right}
.side .tn{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side.win .tn{font-weight:800}
.side.lose .tn{color:var(--txt2)}
/* Escudo completo, sin recorte circular. La caja es fija y la imagen se
   ajusta con max-width/max-height: así todos ocupan lo mismo y ninguno
   se sale, sin importar la proporción del PNG original. */
.crest{width:22px;height:22px;flex:none;display:inline-flex;align-items:center;justify-content:center;
  font-size:8px;font-weight:800;color:var(--txt2);background:transparent;overflow:hidden;line-height:1}
.crest img{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;display:block}
.crest .ini{border:1px solid var(--line);border-radius:4px;width:100%;height:100%;display:grid;place-items:center}
a.crest:hover{opacity:.65}
.z-lib{background:#2f6fed}.z-sud{background:#12b76a}.z-camp{background:#f0b429}
.m-score{text-align:center;font-weight:800;font-size:15px;background:var(--bg);border-radius:5px;padding:2px 0}
.m-score.live{background:var(--live);color:#fff}
.m-score.pend{background:transparent;color:var(--txt3);font-size:13px;font-weight:600}

.empty{padding:34px 16px;text-align:center;color:var(--txt2);font-size:13px}
.empty .big{font-size:30px;display:block;margin-bottom:8px;opacity:.4}

table{width:100%;border-collapse:collapse;font-size:12.5px}
thead th{font-size:10px;text-transform:uppercase;letter-spacing:.4px;color:var(--txt2);font-weight:700;
  padding:7px 3px;border-bottom:1px solid var(--line);text-align:center}
thead th.l{text-align:left;padding-left:8px}
tbody td{padding:6px 3px;text-align:center;border-bottom:1px solid var(--line)}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--bg)}
td.l{text-align:left;padding-left:8px}
.pos{width:24px;font-weight:700;color:var(--txt2);position:relative}
.tcell{display:flex;align-items:center;gap:7px;min-width:0}
.tcell .tn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.pts{font-weight:800}
.zone{position:absolute;left:0;top:0;bottom:0;width:3px}
.z-play{background:#2f6fed}.z-desc{background:#e5484d}.z-risk{background:#f0b429}
.live-tag{width:6px;height:6px;border-radius:50%;background:var(--live);display:inline-block;margin-left:4px;animation:beat 1.4s infinite}
.leg{display:flex;flex-wrap:wrap;gap:10px;padding:8px 12px;font-size:10.5px;color:var(--txt2);border-top:1px solid var(--line)}
.leg i{width:8px;height:8px;border-radius:2px;display:inline-block;margin-right:4px}
.form{display:flex;gap:2px;justify-content:center}
.form b{width:14px;height:14px;border-radius:3px;font-size:8.5px;color:#fff;display:grid;place-items:center;font-weight:800}
.form b.G{background:var(--live)}.form b.E{background:#98a1b8}.form b.P{background:var(--red)}
.note{padding:8px 12px;font-size:10.5px;color:var(--txt2);border-top:1px solid var(--line);line-height:1.5}

.ov{position:fixed;inset:0;background:rgba(8,12,24,.62);z-index:200;display:none;overflow-y:auto;padding:26px 14px}
.ov.show{display:block}
.modal{max-width:640px;margin:0 auto;background:var(--card);border-radius:12px;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.mhead{background:var(--nav);color:#fff;padding:16px}
.mhead .top{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;color:rgba(255,255,255,.65);margin-bottom:12px;gap:8px}
.mhead .x{font-size:20px;color:#fff;line-height:1}
.mscore{display:grid;grid-template-columns:1fr 110px 1fr;align-items:center;gap:8px}
.mscore .t{display:flex;flex-direction:column;align-items:center;gap:7px;text-align:center}
.mscore .t .crest{width:44px;height:44px;font-size:12px}
.mscore .t span{font-size:13px;font-weight:600}
.mscore .sc .n{font-size:34px;font-weight:800;text-align:center;line-height:1}
.mscore .sc .s{font-size:11px;color:rgba(255,255,255,.7);text-align:center;margin-top:4px;text-transform:uppercase;letter-spacing:.6px}
.mscore .sc .s.live{color:#5ee9a8;font-weight:700}
.mscore .sc .pen-cab{font-size:12px;font-weight:800;color:#fff;text-align:center;
  margin-top:5px;letter-spacing:.2px}
.mbody{padding:14px;min-height:150px}
.ev{display:grid;grid-template-columns:1fr 44px 1fr;gap:8px;padding:5px 0;font-size:12.5px;align-items:center}
.ev .m{text-align:center;color:var(--txt2);font-size:11px;font-weight:700}
.ev .r{text-align:right}
.stat{margin-bottom:11px}
.stat .lb{display:flex;justify-content:space-between;font-size:11.5px;margin-bottom:3px}
.stat .lb .c{color:var(--txt2);font-size:10.5px;text-transform:uppercase}
.stat .bar{display:flex;height:6px;border-radius:3px;overflow:hidden;background:var(--line)}
.stat .bar i:first-child{background:var(--acc)}
.stat .bar i:last-child{background:var(--txt3)}
.xi{display:grid;grid-template-columns:1fr 1fr;gap:16px;font-size:12px}
.xi h5{font-size:11px;text-transform:uppercase;color:var(--txt2);margin-bottom:6px}
.xi li{list-style:none;padding:3px 0;border-bottom:1px solid var(--line);display:flex;gap:7px}
.xi li b{color:var(--txt3);width:22px;flex:none;font-size:11px}
.xi li:hover{color:var(--acc)}

/* ── gráfico de estadísticas clave ── */
.clave{background:var(--bg);border-radius:10px;padding:12px 14px 6px;margin-bottom:16px}
/* El título va a la izquierda, arriba del radar, y los dos clubes quedan
   alineados con la columna de números que le toca a cada uno. */
.clave-top{display:grid;grid-template-columns:220px 1fr;gap:14px;align-items:center;
  margin-bottom:12px;font-size:11.5px;font-weight:700}
.clave-eqs{display:flex;justify-content:space-between;align-items:center;gap:10px}
.clave-tit{font-size:10px;text-transform:uppercase;letter-spacing:.6px;color:var(--txt3);font-weight:700}
.clave-fila{display:grid;grid-template-columns:34px 1fr 34px;align-items:center;gap:8px;margin-bottom:11px}
.cl-n{font-size:12.5px;font-weight:800}
.cl-n.der{text-align:right}
.cl-bar{display:flex;gap:3px;height:7px}
.cl-izq,.cl-der{flex:1;background:var(--line);border-radius:4px;overflow:hidden;display:flex}
.cl-izq{justify-content:flex-end}
.cl-izq i{background:var(--acc);height:100%;border-radius:4px}
.cl-der i{background:var(--txt3);height:100%;border-radius:4px}
.cl-lb{grid-column:1/-1;text-align:center;font-size:9.5px;text-transform:uppercase;
  letter-spacing:.5px;color:var(--txt2);margin-top:-7px}

/* ── la cancha ── */
.cancha{position:relative;width:100%;aspect-ratio:105/68;margin:0 auto 16px;
  background:linear-gradient(0deg,#1f7a45,#258a4f);border-radius:10px;overflow:hidden}
html[data-theme="dark"] .cancha{background:linear-gradient(0deg,#14532d,#166534)}
.cancha .lineas{position:absolute;inset:6px;border:2px solid rgba(255,255,255,.35);border-radius:4px}
.cancha .lineas::before{content:"";position:absolute;top:0;bottom:0;left:50%;width:2px;background:rgba(255,255,255,.35)}
.cancha .lineas::after{content:"";position:absolute;left:50%;top:50%;width:64px;height:64px;
  transform:translate(-50%,-50%);border:2px solid rgba(255,255,255,.35);border-radius:50%}
.jug{position:absolute;transform:translate(-50%,-50%);text-align:center;width:52px;cursor:pointer}
.jug .dorsal{display:block;width:26px;height:26px;margin:0 auto;border-radius:50%;
  font-size:11px;font-weight:800;line-height:26px;box-shadow:0 1px 3px rgba(0,0,0,.4)}
.jug.loc .dorsal{background:#fff;color:#111}
.jug.vis .dorsal{background:#111;color:#fff}
.jug .ape{display:block;font-size:9.5px;color:#fff;margin-top:2px;text-shadow:0 1px 2px rgba(0,0,0,.8);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jug:hover .dorsal{outline:2px solid var(--acc)}
.eq-nom{position:absolute;bottom:8px;font-size:10px;color:rgba(255,255,255,.8);
  text-transform:uppercase;letter-spacing:.6px;font-weight:700}
.eq-nom.izq{left:12px}
.eq-nom.der{right:12px}
.jug{width:56px}
.jug .ape{font-size:9px}

/* ── radar de estadísticas ── */
.radar-wrap{display:grid;grid-template-columns:220px 1fr;gap:10px;align-items:center}
.radar{width:100%;height:auto;overflow:visible}
/* Cada estadística se lee como el partido: el número del local a la
   izquierda, el del visitante a la derecha y el nombre en el medio, cada
   uno debajo del club que le corresponde. La barrita de abajo muestra de
   un vistazo quién se llevó ese rubro. */
.radar-nums{display:flex;flex-direction:column;gap:9px}
.rn{display:grid;grid-template-columns:40px 1fr 40px;align-items:center;gap:8px}
.rn b{font-weight:800;font-size:13.5px;font-variant-numeric:tabular-nums;line-height:1}
.rn b:first-child{text-align:left}
.rn b:last-child{text-align:right}
.rn span{text-align:center;color:var(--txt2);font-size:10px;text-transform:uppercase;
  letter-spacing:.4px;line-height:1.15}
.rn-barra{display:flex;height:4px;border-radius:3px;overflow:hidden;
  background:var(--line);margin-top:4px}
.rn-barra i{display:block;height:100%}
.clave-top .pt{width:9px;height:9px;border-radius:50%;display:inline-block}

/* ── ficha de jugador ── */
.datos{display:grid;grid-template-columns:repeat(auto-fit,minmax(72px,1fr));gap:8px;margin-bottom:16px}
.datos div{background:var(--bg);border-radius:8px;padding:9px 6px;text-align:center}
.datos b{display:block;font-size:19px;font-weight:800;line-height:1.1}
.datos span{font-size:10px;color:var(--txt2);text-transform:uppercase;letter-spacing:.4px}
.subt{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--txt2);margin-bottom:9px}
.carrera .cr{display:flex;align-items:center;gap:9px;padding:6px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.carrera .cr:last-child{border-bottom:0}
.carrera .cr-f{margin-left:auto;color:var(--txt3);font-size:11px}

/* ── partidazo del día ── */
.partidazo{cursor:pointer;border-radius:8px;overflow:hidden}
.partidazo:hover{background:var(--bg)}
.pz-eq{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:13px}
.pz-eq .tn{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pz-eq b{font-size:15px;font-weight:800}

.skel{background:linear-gradient(90deg,var(--line) 25%,var(--bg) 50%,var(--line) 75%);background-size:200% 100%;
  animation:sk 1.2s infinite;border-radius:5px;height:13px;margin:9px 14px}
@keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}

.offline{margin:40px auto;max-width:560px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:26px;box-shadow:var(--shadow)}
.offline h2{font-size:17px;margin-bottom:10px}
.offline p{font-size:13.5px;color:var(--txt2);margin-bottom:12px;line-height:1.6}
.offline pre{background:var(--nav);color:#9ae6b4;padding:12px 14px;border-radius:8px;font-size:12.5px;overflow-x:auto}
footer{max-width:1240px;margin:0 auto;padding:18px 16px 34px;color:var(--txt2);font-size:11.5px;text-align:center;line-height:1.7}

.burger{display:none;font-size:19px;width:32px;height:32px;border-radius:8px;background:rgba(255,255,255,.1)}
.scrim{display:none;position:fixed;inset:0;background:rgba(8,12,24,.5);z-index:120}
.scrim.show{display:block}

/* Acá el menú de ligas ya no entra al costado. Antes se escondía y listo,
   pero la hamburguesa recién aparecía a los 900px: entre 900 y 1180 no había
   forma de cambiar de liga ni de volver a la portada. Ahora el cajón y su
   botón arrancan juntos, en este mismo corte. */
@media(max-width:1180px){
  .shell{grid-template-columns:minmax(0,1fr) 348px}
  .burger{display:grid;place-items:center}
  aside{display:block;position:fixed;left:0;top:0;bottom:0;width:250px;z-index:130;
    border-radius:0;border:0;overflow-y:auto;transform:translateX(-100%);
    transition:transform .22s ease;padding-top:8px}
  aside.open{transform:none}
  aside a{padding:11px 14px;font-size:14px}
}

@media(max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr);padding:0 10px;margin-top:10px;gap:10px}
  .hwrap{gap:9px;padding:0 11px;height:52px}
  .logo{font-size:17px} .logo .ball{width:26px;height:26px;border-radius:6px}
  .logo .ball svg{width:16px;height:16px}
  .tag,.hsearch{display:none}
  .hbtn{padding:0 9px;font-size:12px;height:30px}
  #bar .in{padding:6px 11px;font-size:11.5px}
  #barTime{display:none}

  .match{padding:9px 8px}
  .m-fila{grid-template-columns:46px minmax(0,1fr) 42px minmax(0,1fr);gap:6px}
  .m-goles{margin-left:52px;margin-right:52px}
  .m-tv{margin-left:52px}
  .m-pen{grid-template-columns:46px minmax(0,1fr) 42px minmax(0,1fr);gap:6px}
  .side .tn{font-size:12.5px}
  .m-time{font-size:11px} .m-time .st{font-size:9px}
  .m-score{font-size:14px}
  .crest{width:20px;height:20px}
  .day .dn{font-size:15px} .day .dw{font-size:9px}
  .rounds{padding:8px 10px} .rounds button{min-width:30px;height:28px;font-size:12px}
  .tabs button{padding:9px 10px;font-size:11.5px}
  table{font-size:12px}
  thead th{font-size:9.5px;padding:6px 2px}
  tbody td{padding:6px 2px}
  .tcell .tn{font-size:12px}

  .ov{padding:0}
  .modal{max-width:100%;border-radius:0;min-height:100vh}
  .mhead{padding:14px 12px}
  .mscore{grid-template-columns:1fr 88px 1fr}
  .mscore .sc .n{font-size:28px}
  .mscore .t .crest{width:38px!important;height:38px!important}
  .mscore .t span{font-size:12px}
  .mbody{padding:12px}
  .xi{grid-template-columns:1fr;gap:14px}
  .jug{width:38px}
  .jug .ape{font-size:8px;letter-spacing:-.2px}
  .jug .dorsal{width:20px;height:20px;line-height:20px;font-size:9.5px}
  .cancha{aspect-ratio:105/74;border-radius:8px}
  .cancha .lineas{inset:4px}
  .cancha .lineas::after{width:44px;height:44px}
  .eq-nom{font-size:9px;bottom:5px}
  .eq-nom.izq{left:7px} .eq-nom.der{right:7px}
  .radar-wrap{grid-template-columns:1fr;gap:2px}
  .radar{max-width:250px;margin:0 auto}
  .radar-nums{gap:7px}
  .rn{grid-template-columns:34px 1fr 34px;gap:6px}
  .rn b{font-size:12.5px}
  .rn span{font-size:9.5px}
  .clave{padding:10px 10px 4px}
  .clave-top{grid-template-columns:1fr;gap:4px;font-size:10.5px}
  .clave-tit{display:none}
  .datos{grid-template-columns:repeat(4,1fr);gap:6px}
  .datos b{font-size:16px}
  .datos span{font-size:9px}
  .m-goles{font-size:10px}
  .m-tv{font-size:9px}
  /* el cuadro en el celular: cajas y letras más chicas, y los botones de
     ronda más grandes para poder tocarlos con el dedo */
  .cuadro-wrap{padding:10px 10px}
  .cuadro-barra{padding:8px 10px 0}
  .cuadro-barra .cbtn{width:34px;height:34px;font-size:17px}
  .brk .eq{height:22px;font-size:11px;padding:0 6px;gap:5px}
  .brk .eq b{font-size:11px}
  .brk .eq .crest{width:14px;height:14px}
  .brk-et{font-size:9.5px}
  .clubgrid{grid-template-columns:repeat(auto-fill,minmax(128px,1fr))}
  footer{padding:14px 12px 26px;font-size:11px}
}

@media(max-width:400px){
  .m-fila{grid-template-columns:40px minmax(0,1fr) 38px minmax(0,1fr)}
  .side .tn{font-size:11.5px}
  .logo span span{display:none}   /* sólo el icono */
}

<body>

<header>
  <div class="hwrap">
    <button class="burger" onclick="App.menu()" aria-label="Menú">☰</button>
    <a href="/" class="logo">
      <span class="ball" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2.4" y="4" width="19.2" height="13" rx="2.2"/><path d="M8.5 20.6h7M12 17.6v3"/></svg></span>
      <span><span class="h">HAY</span><span class="m">VAR</span></span></a>
    <span id="clubCrest" class="clubcrest" style="display:none"></span>
    <span class="beta">beta</span>
    <span class="tag">Liga Profesional · Clausura 2026</span>
    <div class="hsearch">
      <span class="ic">⌕</span>
      <input placeholder="Buscar equipo o jugador…" title="Todavía sin función" disabled>
    </div>
    <div class="hspacer"></div>
    <button class="hbtn" id="liveBtn" onclick="App.onlyLive()">● VIVO <span id="liveCnt">0</span></button>
    <button class="hbtn" onclick="App.reload(true)" title="Actualizar">↻</button>
    <button class="hbtn" onclick="App.clubPicker()" title="Modo club">◑</button>
    <button class="hbtn" onclick="App.theme()" title="Modo noche">🌓</button>
  </div>
  <div id="bar" style="display:none"><div class="in">
    <span class="dot" id="dot"></span>
    <span id="barTxt">Conectando…</span>
    <span class="hspacer" style="flex:1"></span>
    <span id="barTime" style="opacity:.7"></span>
  </div></div>
</header>

<div class="scrim" id="scrim" onclick="App.menu(false)"></div>
<div id="app"></div>

<footer>
  <div>Fixture, posiciones, promedios y goleadores: <b>AFA</b>.
       Minuto a minuto, formaciones y escudos: <b>365scores</b>.</div>
  <div style="margin-top:4px">Proyecto personal sin fines comerciales.
       HAYVAR no está asociado a la AFA, a la Liga Profesional ni a los clubes.</div>
</footer>

<div class="ov" id="ov" onclick="if(event.target===this)App.closeModal()"><div class="modal" id="modalBox"></div></div>

<script>
/* ───────────────────────────────────────────────────────────────────────
   Actualización en vivo

   La página no se recarga nunca sola: eso hacía saltar el scroll y cortaba
   la lectura. En su lugar, cuando hay partidos en juego se piden los datos
   cada tanto y se reescriben únicamente los pedacitos que cambiaron —el
   minuto y el marcador— dejando el resto del DOM intacto. Si nada cambió,
   no se toca nada.

   VIVO_CADA son los segundos entre consultas. Sólo consulta si hay algo en
   juego o a punto de empezar; si no, se queda quieto y no gasta nada.
   ─────────────────────────────────────────────────────────────────────── */
const VIVO_ACTIVO = true;
const VIVO_CADA   = 20;
const VIVO_MARGEN = 3;    // horas antes y después del horario, para el arranque

// El refresco completo de la página queda apagado.
const AUTO_REFRESCO = false;
const CADA_EN_VIVO  = 30;
const CADA_NORMAL   = 180;

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const js=s=>esc(String(s??'').replace(/\\/g,'\\\\').replace(/'/g,"\\'"));
const pad=n=>String(n).padStart(2,'0');
const MONTHS=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const DOW=['dom','lun','mar','mié','jue','vie','sáb'];
const DIAS=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto',
             'septiembre','octubre','noviembre','diciembre'];
const initials=n=>String(n||'').split(/\s+/).filter(Boolean).slice(0,3).map(w=>w[0]).join('').toUpperCase().slice(0,3);
const hhmm=iso=>{const d=new Date(iso);return pad(d.getHours())+':'+pad(d.getMinutes());};

async function get(path){
  const r=await fetch(path,{cache:'no-store'});
  if(!r.ok) throw new Error('HTTP '+r.status);
  const j=await r.json();
  if(j.error) throw new Error(j.error);
  return j;
}

const App=(()=>{
  const S={round:null,rounds:[],games:[],tab:'A',onlyLive:false,liga:'home',emblemas:{},current:null,
           homeDate:new Date(),weekStart:null,home:null,club:null,
           standings:null,annual:null,promedios:null,scorers:null,otra:null,
           scores:{},detalles:{},detallesDe:null,timer:null,vivoTimer:null,failures:0};

  // link=true convierte el escudo en un enlace al sitio oficial del club
  const crest=(t,px,link)=>{
    const s=px?`width:${px}px;height:${px}px;font-size:${Math.round(px/3.4)}px`:'';
    const ini=esc((t&&t.short)||initials(t&&t.name));
    const inner=t&&t.logo
      ? `<img src="${esc(t.logo)}" alt="${esc(t&&t.name)}" loading="lazy"
           onerror="this.parentNode.innerHTML='<span class=\\'ini\\'>${ini}</span>'">`
      : `<span class="ini">${ini}</span>`;
    return (link&&t&&t.site)
      ? `<a class="crest" style="${s}" href="${esc(t.site)}" target="_blank" rel="noopener"
           title="Sitio oficial de ${esc(t.name)}">${inner}</a>`
      : `<span class="crest" style="${s}">${inner}</span>`;
  };

  /* ── layout base ── */
  function shell(portada){
    if($('.shell')&&!!$('#calMonth')===!!portada) return;
    $('#app').innerHTML=`
      <div class="shell">
        <aside id="side"></aside>
        <main>
          ${portada
            ? `<div class="calbar">
                 <div class="calhead"><div class="mth" id="calMonth">—</div>
                   <div class="navs"><button onclick="App.homeWeek(-1)">‹</button>
                     <button onclick="App.homeDay()" style="width:auto;padding:0 10px;font-size:11px;font-weight:700">HOY</button>
                     <button onclick="App.homeWeek(1)">›</button></div></div>
                 <div class="days" id="days"></div></div>`
            : `<div class="card"><div class="rounds" id="rounds"><span class="lb">Fecha</span></div></div>`}
          <div class="card"><div id="matches"><div class="skel" style="width:55%"></div><div class="skel"></div><div class="skel" style="width:75%"></div></div></div>
        </main>
        <div>
          <div class="card">
            <div class="tabs" id="tabs">
              <button data-t="A" class="on" onclick="App.tab('A')">Zona A</button>
              <button data-t="B" onclick="App.tab('B')">Zona B</button>
              <button data-t="anual" onclick="App.tab('anual')">Anual</button>
              <button data-t="prom" onclick="App.tab('prom')">Promedios</button>
              <button data-t="gol" onclick="App.tab('gol')">Goles</button>
            </div>
            <div id="right"><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>
          </div>
        </div>
      </div>`;
  }

  // Las que no están activas quedan a la vista pero apagadas, listas para sumar.
  const LIGAS=[
    ['',[['home','Portada',1]]],
    ['Argentina',[['lpf','Liga Profesional',1],['nacional','Primera Nacional',1],
                  ['pbm','Primera B Metro',1],['fa','Federal A',1],
                  ['ca','Copa Argentina',1]]],
    ['Internacional',[['lib','Libertadores',1],['sud','Sudamericana',1],['ucl','Champions',0]]],
    ['Europa',[['laliga','LaLiga',1],['pre','Premier League',0],['sa','Serie A',0],['bun','Bundesliga',0]]],
    ['Fútbol femenino',[['fem','Primera División Argentina',1]]]
  ];

  function drawSide(){
    const el=$('#side'); if(!el) return;
    const emb=id=>{
      const e=S.emblemas[id];
      return e?`<img class="lgimg" src="${esc(e)}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">`
              :'<span class="lgimg"></span>';
    };
    el.innerHTML=LIGAS.map(([grupo,items])=>
      (grupo?`<h4>${esc(grupo)}</h4>`:'')+items.map(([id,nombre,activa])=>
        activa
          ? `<a class="${S.liga===id?'on':''}" onclick="App.liga('${id}')">${id==='home'?'<span class="lgimg">◎</span>':emb(id)}<span class="nm">${esc(nombre)}</span></a>`
          : `<a class="off" title="Todavía no disponible"><span class="nm">${esc(nombre)}</span><span class="pill">pronto</span></a>`
      ).join('')+'<div class="sep"></div>').join('');
  }

  async function cargarEmblemas(){
    try{
      const d=await get('/api/ligas');
      d.ligas.forEach(l=>{ if(l.emblema) S.emblemas[l.id]=l.emblema; });
      drawSide();
    }catch(e){}
  }

  /* ── portada: partidos del día de todas las ligas ── */
  const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x;};

  function drawCal(){
    const d=S.homeDate, ws=S.weekStart;
    $('#calMonth').textContent=`${MESES[d.getMonth()]} ${d.getFullYear()}`;
    const hoy=ymd(new Date());
    $('#days').innerHTML=Array.from({length:7},(_,i)=>{
      const dd=addDays(ws,i), s=ymd(dd);
      return `<div class="day ${s===ymd(d)?'sel':''} ${s===hoy?'today':''}" onclick="App.homeDay('${s}')">
        <div class="dw">${DOW[dd.getDay()]}</div><div class="dn">${dd.getDate()}</div></div>`;
    }).join('');
  }

  async function loadHome(){
    shell(true); drawSide();
    if(!S.weekStart){ const w=new Date(S.homeDate); w.setDate(w.getDate()-((w.getDay()+6)%7)); S.weekStart=w; }
    drawCal();
    $('.tag').textContent='Portada';
    $('#matches').innerHTML='<div class="skel" style="width:55%"></div><div class="skel"></div><div class="skel"></div>';

    catch(e){ return status('err','No se pudo cargar la portada: '+esc(e.message)); }
    S.home=h; S.games=h.bloques.flatMap(b=>b.games);
    // en modo club, el panel de la derecha arranca con el partido anterior
    // y el siguiente del equipo elegido
    S.clubGames=null;

      try{ S.clubGames=await get('/api/club?name='+encodeURIComponent(S.club.name)); }

    $('#matches').innerHTML=h.total
      ? h.bloques.map(b=>`<div class="lgrow">

          + b.games.map(matchRow).join('')).join('')

    $('#liveCnt').textContent=h.live;
    $('#liveBtn').classList.toggle('on',h.live>0);
    // faltaba esto: la portada armaba las filas pero nunca pedía los
    // goleadores ni el canal, así que abajo de cada partido no salía nada
    cargarDetalles();
    drawHomeRight();
    status(h.live?'live':'ok', h.live
      ? `<b>${h.live} partido${h.live>1?'s':''} en vivo</b> · el marcador se actualiza solo`
      : `<b>${h.total} partido${h.total===1?'':'s'}</b> el ${DIAS[S.homeDate.getDay()]} ${S.homeDate.getDate()} de ${MESES[S.homeDate.getMonth()]}`);
    clearTimeout(S.timer);
    if(AUTO_REFRESCO) S.timer=setTimeout(loadHome,(h.live?CADA_EN_VIVO:CADA_NORMAL)*1000);
    programarVivo();
  }

  /* ── el equipo de uno, en la portada ─────────────────────────────────
     Con el modo club encendido, lo primero que se quiere ver no es el
     resumen del día sino cómo salió el último partido y cuándo es el
     que viene. Ese bloque ocupa ese lugar.                            */
  function bloqueClub(){

      const marcador=m.gh!=null?`<b style="font-size:14px">${m.gh}-${m.ga}</b>`

    };
    return `<div style="padding:12px 14px;border-bottom:1px solid var(--line)">
      <div style="display:flex;align-items:center;gap:7px;margin-bottom:7px">
        ${c.logo?`<img src="${esc(c.logo)}" alt="" style="width:20px;height:20px;object-fit:contain">`:''}

  // Panel derecho de la portada: lo que pasa hoy, sin tener que entrar al torneo
  function drawHomeRight(){
    const h=S.home; if(!h) return;
    const vivos=S.games.filter(m=>m.status==='LIVE');
    // ordenados por hora: primero el que está más cerca de empezar
    const ahora=Date.now();
    const proximos=S.games.filter(m=>m.status==='PROG'&&m.start)
      .sort((a,b)=>new Date(a.start)-new Date(b.start))
      .filter((m,i,arr)=>new Date(m.start)>=ahora||arr.every(x=>new Date(x.start)<ahora))
      .slice(0,6);
    const finalizados=S.games.filter(m=>m.status==='FIN');
    // El partidazo lo elige el servidor: el partido de Primera con el equipo
    // mejor ubicado en la tabla, salvo la fecha de los interzonales, donde
    // manda el clásico. Si por lo que sea no vino, se cae al que tuvo más goles.
    const golazo=S.games.find(m=>String(m.id)===String(h.partidazo))
      || finalizados.slice().sort((a,b)=>((b.gh+b.ga)-(a.gh+a.ga)))[0];
    $('#tabs').innerHTML='';
    $('#right').innerHTML=`
      ${S.club?bloqueClub():`<div style="padding:12px 14px;border-bottom:1px solid var(--line)">

          ${[['En vivo',vivos.length,'var(--live)'],['Jugados',finalizados.length,'var(--txt)'],['Por jugar',S.games.length-vivos.length-finalizados.length,'var(--txt)']]
            .map(([lb,n,c])=>`<div style="background:var(--bg);border-radius:8px;padding:9px 4px">
              <div style="font-size:21px;font-weight:800;color:${c};line-height:1">${n}</div>
              <div style="font-size:10px;color:var(--txt2);text-transform:uppercase;letter-spacing:.4px;margin-top:3px">${lb}</div></div>`).join('')}
        </div>
      </div>`}
      ${golazo?`<div style="padding:11px 14px;border-bottom:1px solid var(--line)">
        <div style="font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--txt2);margin-bottom:7px">Partidazo del día</div>
        <div class="partidazo" onclick="App.openMatch('${js(golazo.id)}')">
          <div class="pz-eq">${crest(golazo.home,20)}<span class="tn">${esc(golazo.home.canon||golazo.home.name)}</span>
            <b>${golazo.gh??''}</b></div>
          <div class="pz-eq">${crest(golazo.away,20)}<span class="tn">${esc(golazo.away.canon||golazo.away.name)}</span>
            <b>${golazo.ga??''}</b></div>
          <div style="font-size:10px;color:var(--txt2);padding:2px 0 0">
            ${golazo.interzonal?'Interzonal · ':''}${golazo.status==='LIVE'?(golazo.minute??'')+"' en vivo"
              :golazo.status==='FIN'?'Finalizado':hhmm(golazo.start)}</div>
        </div></div>`:''}
      ${proximos.length?`<div style="padding:11px 14px 4px">
        <div style="font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--txt2);margin-bottom:5px">Lo que viene</div></div>
        ${proximos.map(m=>`<div class="match" style="grid-template-columns:46px 1fr" onclick="App.openMatch('${js(m.id)}')">
          <div class="m-time">${hhmm(m.start)}</div>
          <div style="min-width:0">
            <div class="tcell" style="gap:6px">${crest(m.home,17)}<span class="tn" style="font-size:12.5px">${esc(m.home.canon||m.home.name)}</span></div>
            <div class="tcell" style="gap:6px;margin-top:3px">${crest(m.away,17)}<span class="tn" style="font-size:12.5px">${esc(m.away.canon||m.away.name)}</span></div>
          </div></div>`).join('')}`:''}
      <div class="note">Elegí un torneo en el menú de la izquierda para ver sus tablas.</div>`;
  }

  /* ── modo club ── */
  function aclarar(hex,f){
    const n=parseInt(hex.slice(1),16), r=(n>>16)&255, g=(n>>8)&255, b=n&255;
    const m=(x)=>Math.round(x+(255-x)*f);
    return `#${((1<<24)+(m(r)<<16)+(m(g)<<8)+m(b)).toString(16).slice(1)}`;
  }
  function oscurecer(hex,f){
    const n=parseInt(hex.slice(1),16), r=(n>>16)&255, g=(n>>8)&255, b=n&255;
    const m=(x)=>Math.round(x*(1-f));
    return `#${((1<<24)+(m(r)<<16)+(m(g)<<8)+m(b)).toString(16).slice(1)}`;
  }
  // luminancia relativa, para saber si sobre ese color va texto claro u oscuro
  const claro=hex=>{
    const n=parseInt(hex.slice(1),16);
    return (0.299*((n>>16)&255)+0.587*((n>>8)&255)+0.114*(n&255))/255 > .6;
  };

  function aplicarClub(c){
    const raiz=document.documentElement;
    const ball=document.querySelector('.logo .ball');
    const var_=document.querySelector('.logo .m');
    const hay=document.querySelector('.logo .h');
    const esc_=document.querySelector('#clubCrest');
    if(!c){
      ['--nav','--nav2','--acc'].forEach(v=>raiz.style.removeProperty(v));
      ball.style.background=''; ball.style.color='';
      var_.style.color=''; hay.style.color='';
      esc_.innerHTML=''; esc_.style.display='none';
      try{localStorage.removeItem('hayvar.club');}catch(e){}
      S.club=null; return;
    }
    // el fondo va con el color principal; si es muy claro, se oscurece para
    // que el "HAY" en blanco siga leyéndose
    const fondo=claro(c.primary)?oscurecer(c.primary,.55):c.primary;
    raiz.style.setProperty('--nav',fondo);
    raiz.style.setProperty('--nav2',oscurecer(fondo,.18));
    raiz.style.setProperty('--acc',claro(c.accent)?oscurecer(c.accent,.35):c.accent);
    // HAY siempre en blanco y VAR en el color secundario del club. Pero si
    // ese segundo color también es blanco —Argentinos, Estudiantes, Talleres,
    // varios— las dos palabras quedarían iguales y se perdería la partición
    // del logo. En ese caso se lleva a un gris que sigue leyéndose sobre la
    // barra oscura pero se distingue del blanco.
    const luz=hex=>{const n=parseInt(hex.slice(1),16);
      return (0.299*((n>>16)&255)+0.587*((n>>8)&255)+0.114*(n&255))/255;};
    hay.style.color='#fff';
    var_.style.color = luz(c.accent) > .82 ? oscurecer(c.accent,.42) : c.accent;
    ball.style.background=c.accent;
    ball.style.color=claro(c.accent)?'#111':'#fff';
    esc_.style.display='inline-flex';
    esc_.innerHTML=c.logo
      ? `<img src="${esc(c.logo)}" alt="${esc(c.name)}" title="${esc(c.name)}">`
      : '';
    S.club=c;
    try{localStorage.setItem('hayvar.club',JSON.stringify(c));}catch(e){}
  }

  function offline(msg){
    $('#app').innerHTML=`<div class="offline">
      <h2>El servidor de datos no está corriendo</h2>

  /* ── barra de estado ── */
  // La barra sólo aparece cuando tiene algo que decir: partidos en vivo o
  // algún problema. Si está todo normal se esconde; la atribución de las
  // fuentes vive en el pie, que es donde corresponde.
  function status(kind,txt){
    const bar=$('#bar');
    if(kind==='ok'){ bar.style.display='none'; return; }
    bar.style.display='';
    $('#dot').className='dot '+kind;
    $('#barTxt').innerHTML=txt;
    const d=new Date();
    $('#barTime').textContent='actualizado '+pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds());
  }

  /* ── selector de fechas ── */
  /* En las copas los botones no son números sino etapas. Los nombres que
     manda 365scores son largos —"Octavos de final"— y no entran, así que se
     acortan a lo que cualquiera diría en voz alta. */
  // Ojo con el orden: "32avos de final" también contiene "final", así que
  // las rondas específicas tienen que probarse antes que la final.
  const ETAPA_CORTA=[[/fase de grupos|group/i,'Grupos'],
    [/repechaje|play.?off|pre.?octavos/i,'Pre octavos'],
    // las previas se numeran: en la Libertadores son tres y "Previa" a secas
    // las dejaba a las tres iguales
    [/fase 3|tercera fase/i,'Previa 3'],
    [/fase 2|segunda fase/i,'Previa 2'],
    [/fase 1|primera fase|preliminar|previa/i,'Fase previa'],
    [/64avos|sesentaicuatroavos|round of 128/i,'64avos'],
    [/32avos|treintaidosavos|treintaydosavos|round of 64/i,'32avos'],
    [/16avos|dieciseisavos|diecis[eé]isavos|round of 32/i,'16avos'],
    [/octavos|round of 16/i,'Octavos'],
    [/cuartos|quarter/i,'Cuartos'],[/semi/i,'Semis'],[/tercer/i,'3° puesto'],
    [/final/i,'Final']];
  function etapaCorta(nombre){
    const t=String(nombre||'').trim(); if(!t) return t;
    for(const [re,corto] of ETAPA_CORTA) if(re.test(t)) return corto;
    return t.length>11?t.slice(0,10)+'…':t;
  }

  function drawRounds(){
    const el=$('#rounds');
    const et=S.etapas;
    // Torneos por fases (Federal A): primero se elige la fase y después la
    // fecha, porque cada fase vuelve a numerar desde el uno.
    const fl=S.fasesLiga;
    if(fl&&fl.length){
      const actual=fl.find(f=>f.num===S.fase)||fl[fl.length-1];
      S.fase=actual.num;
      const suyas=S.rounds.filter(r=>actual.rounds.includes(r.round));
      if(!suyas.some(r=>r.round===S.round)&&suyas.length)
        S.round=suyas[suyas.length-1].round;
      return void(el.innerHTML=`<span class="lb">Fase</span>`
        + fl.map(f=>`<button class="${f.num===actual.num?'on':''}"
             style="padding:0 11px" onclick="App.fase(${f.num})">${esc(f.nombre)}</button>`).join('')
        + `<span class="lb" style="margin-left:10px">Fecha</span>`
        + suyas.map(r=>`<button class="${r.round===S.round?'on':''} ${r.live?'playing':''}
             ${r.round===S.current?'actual':''}" onclick="App.pick(${r.round})">${r.round}</button>`).join(''));
    }
    const rotulo=r=>et&&et[r-1]?esc(etapaCorta(et[r-1])):r;
    const titulo=r=>et&&et[r-1]?esc(et[r-1])
      :(r===S.current?'Fecha en curso':'');
    el.innerHTML=`<span class="lb">${et?'Etapa':'Fecha'}</span>`+S.rounds.map(r=>
      `<button class="${r.round===S.round?'on':''} ${r.live?'playing':''} ${r.round===S.current?'actual':''}"
         title="${titulo(r.round)}" onclick="App.pick(${r.round})">${rotulo(r.round)}</button>`
    ).join('');
  }

  /* ── partidos ── */
  // Las tres piezas que cambian durante un partido, separadas del resto de
  // la fila para poder reescribir sólo eso sin volver a dibujar nada más.
  function htmlTiempo(m){
    const lv=m.status==='LIVE', fin=m.status==='FIN', susp=m.status==='SUSP';
    if(lv) return `<div class="m-time live"><span class="mm">${m.minute??''}'</span><span class="st">en vivo</span></div>`;
    if(fin) return `<div class="m-time fin">${hhmm(m.start)}<span class="st">final</span></div>`;
    if(susp) return `<div class="m-time fin">—<span class="st">susp.</span></div>`;
    const d=new Date(m.start);
    return `<div class="m-time">${hhmm(m.start)}<span class="st">${DOW[d.getDay()]} ${d.getDate()}/${d.getMonth()+1}</span></div>`;
  }
  function htmlMarcador(m){
    return m.gh==null ? `<div class="m-score pend">vs</div>`
                      : `<div class="m-score ${m.status==='LIVE'?'live':''}">${m.gh}-${m.ga}</div>`;
  }
  const claseLado=(m,local)=>{
    const decidido=m.status==='FIN'||m.status==='LIVE';
    const gana=decidido&&(local ? m.gh>m.ga : m.ga>m.gh);
    const pierde=decidido&&(local ? m.gh<m.ga : m.ga<m.gh);
    return `side ${local?'':'away '}${gana?'win':''}${pierde?'lose':''}`.replace(/\s+/g,' ').trim();
  };

  // Goleadores y canal de TV, si ya los trajimos para esta fecha
  function htmlExtras(m){
    const d=S.detalles[m.id];
    if(!d) return '<div class="m-extra"></div>';
    // el gol anulado se muestra igual —es parte de lo que pasó— pero tachado
    // y en gris, para que no se confunda con los que valieron
    // Cada gol es un bloque propio y el separador va pegado al anterior. Si
    // se escribía " · " suelto, al cortarse el renglón el punto quedaba
    // colgado al principio de la línea siguiente, lejos del nombre.
    // La tanda de penales no son goles del partido: se cuentan aparte y se
    // muestran como "Penales 4-2", que es como se lee en cualquier lado.
    const tanda=(d.goles||[]).filter(g=>g.penales&&!g.anulado);
    const penales=tanda.length
      ? `Penales ${tanda.filter(g=>g.side==='h').length}-${tanda.filter(g=>g.side==='a').length}`
      : '';
    const lado=s=>(d.goles||[]).filter(g=>g.side===s&&!g.penales).map(g=>{
      const txt=`${esc(g.player.split(' ').slice(-1)[0])} ${g.min}${g.added?'+'+g.added:''}'`;
      return `<span class="gol">${g.anulado
        ? `<span class="gol-anulado" title="Gol anulado por el VAR">${txt}</span>`
        : txt}</span>`;
    }).join('');
    const gh=lado('h'), ga=lado('a');
    const tv=(d.tv||[]).join(' · ');
    return `<div class="m-extra">
      ${(gh||ga)?`<div class="m-goles"><span>${gh}</span><span>${ga}</span></div>`:''}
      ${penales?`<div class="m-pen"><b>${penales}</b></div>`:''}
      ${tv?`<div class="m-tv" title="Se ve por ${esc(tv)}">${esc(tv)}</div>`:''}
    </div>`;
  }

  function matchRow(m){
    const changed=S.scores[m.id]!==undefined && S.scores[m.id]!==`${m.gh}-${m.ga}` && m.gh!=null;
    S.scores[m.id]=`${m.gh}-${m.ga}`;
    // el id es texto (viene del fixture de AFA): tiene que ir entre comillas
    return `<div class="match ${changed?'flash':''}" data-id="${esc(m.id)}" onclick="App.openMatch('${js(m.id)}')">
      <div class="m-fila">
        ${htmlTiempo(m)}
        <div class="${claseLado(m,true)}">${crest(m.home)}<span class="tn">${esc(m.home.canon||m.home.name)}</span></div>

  // Los goleadores y la TV se piden aparte, después de dibujar la fecha:
  // son un pedido por partido y no vale la pena hacer esperar a la lista.
  async function cargarDetalles(){
    // En la portada la clave es el día, no la fecha del torneo: son partidos
    // de varias ligas juntos y hay que pedirlos por día.
    const enPortada=S.liga==='home';
    const clave=enPortada?`home-${ymd(S.homeDate)}`:`${S.liga}-${S.round}`;
    if(S.detallesDe===clave) return;
    S.detallesDe=clave;
    try{
      const url=enPortada
        ? `/api/detalles?date=${ymd(S.homeDate)}`
        : (S.liga==='lpf'
            ? `/api/detalles?round=${S.round??''}`
            : `/api/detalles?id=${S.liga}&round=${S.round??''}`);
      const d=await get(url);
      Object.assign(S.detalles,d.detalles||{});
    }catch(e){ return; }
    // se repintan sólo los bloques de extras, sin tocar el resto
    document.querySelectorAll('.match[data-id]').forEach(fila=>{
      const m=S.games.find(x=>String(x.id)===fila.getAttribute('data-id'));
      if(!m) return;
      const viejo=fila.querySelector('.m-extra');
      if(viejo) reemplazar(viejo,htmlExtras(m));
    });
  }

  function drawMatches(){
    let list=S.games;
    if(S.onlyLive) list=list.filter(m=>m.status==='LIVE');
    const n=S.games.filter(m=>m.status==='LIVE').length;
    $('#liveCnt').textContent=n;
    $('#liveBtn').classList.toggle('on',S.onlyLive||n>0);

    if(!list.length){
      $('#matches').innerHTML=`<div class="empty"><span class="big">⚽</span>${S.onlyLive?'No hay partidos en vivo en este momento.':'No hay partidos para esta fecha.'}</div>`;
      return;
    }
    // el interzonal primero, después Zona A y Zona B
    const grupos=[['X',[]],['A',[]],['B',[]]];
    const put=(k,m)=>grupos.find(g=>g[0]===k)[1].push(m);
    list.forEach(m=>put(m.interzonal?'X':(m.zone||'X'),m));
    $('#matches').innerHTML=grupos.filter(([,v])=>v.length).map(([z,ms])=>{
      const inter=z==='X';
      const todaInter=grupos.filter(([,v])=>v.length).length===1&&inter;
      if(z==='—'||z==='null'||z==='undefined') return ms.map(matchRow).join('');
      return `<div class="zhead">
          <span class="badge"${inter?' style="background:#ff3b30"':''}>${inter?'↔':esc(sigla(z))}</span>
          <span class="nm">${inter?(todaInter?'Fecha de clásicos interzonales':'Interzonal'):(/zona|grupo/i.test(z)?esc(z):'Zona '+esc(z))}</span></div>`
        + ms.map(matchRow).join('');
    }).join('');
    cargarDetalles();
  }
